<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학원 출석부</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="db.js?v=0.80.0"></script>
<style>.expitem:hover{background:#F2F5F3!important}.cgrip:hover,.cgrip:active{background:linear-gradient(#00A6AB,#00A6AB) center/2px 100% no-repeat}.arow:hover>span,.arow:hover>button{box-shadow:inset 0 1px 0 #AEB7B2,inset 0 -1px 0 #AEB7B2}
.shell{height:100vh!important;min-height:0!important}.shellmain{flex:1 1 auto!important;min-height:0!important;overflow:hidden!important;padding-bottom:14px!important}.shell>header,.shell>nav,.shell>div:not(.shellmain){flex:none!important}.shellmain>*:not(.shellsec){flex:none}.shellsec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.shellscroll{flex:1 1 auto;min-height:0;overflow:auto!important}
@media print{.shell{height:auto!important}.shellmain{overflow:visible!important}.shellsec{display:block!important}.shellscroll{overflow:visible!important}}

.ponly{display:none!important}@media print{.ponly{display:flex!important}.scronly{display:none!important}}.phead{position:sticky;top:0;z-index:6;background:#FFFFFF;box-shadow:0 6px 10px -8px rgba(23,32,28,.25)}@media print{.phead{position:static!important;box-shadow:none!important}}


@keyframes tabdrop{0%{transform:translateY(-3px);background-color:#E6F6F6}60%{transform:translateY(0);background-color:#E6F6F6}100%{transform:none}}.tabdrop{animation:tabdrop .7s ease-out}@keyframes aflash{0%,55%{background-image:linear-gradient(rgba(0,166,171,.18),rgba(0,166,171,.18))}100%{background-image:linear-gradient(transparent,transparent)}}
.flashtag{animation:tagfade 4s ease-out forwards}
@keyframes tagfade{0%,75%{opacity:1}100%{opacity:0}}

.qname{cursor:pointer}.qname:hover{background-image:linear-gradient(rgba(138,180,232,.16),rgba(138,180,232,.16))!important}.qname.qsel{box-shadow:inset 0 0 0 2px #8AB4E8;background-image:linear-gradient(rgba(138,180,232,.2),rgba(138,180,232,.2))!important}
.qedlg [disabled]{opacity:.42;cursor:not-allowed!important}
body{margin:0;background:#F3F5F4}
a{color:#1F7A5A}a:hover{color:#165C43}
button{font-family:inherit}
button:focus-visible{outline:2px solid #2563EB;outline-offset:-2px}
@page{size:A4 landscape;margin:7mm}html.bwp section[aria-label="출석부"] *{color:#000!important;background-color:transparent!important;background-image:none!important}html.bwp section[aria-label="출석부"] [style*="1.5px solid"]{border-color:#000!important}html.bwp section[aria-label="출석부"] [style*="background: #00A6AB"],html.bwp section[aria-label="출석부"] [style*="background: #E0605A"]{background-color:#000!important}html.bwp section[aria-label="출석부"] [style*="#E2C35E"]{box-shadow:inset 0 0 0 2px #000!important}html.bwp section[aria-label="출석부"] [style*="background: #00A6AB"][style*="color: #FFFFFF"],html.bwp section[aria-label="출석부"] [style*="background: #00A6AB; color: #FFFFFF"]{background-color:transparent!important;box-shadow:inset 0 0 0 1.5px #000!important}@media print{.noprint{display:none!important}.approot{min-height:0!important}html,body{background:#FFFFFF!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0!important;gap:0!important}section[aria-label="출석부"]{box-shadow:none!important;overflow:visible!important;border-radius:0!important}}
.pbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 0 var(--sh),0 8px 16px rgba(23,32,28,.08);transition:transform .07s ease,box-shadow .07s ease;-webkit-tap-highlight-color:transparent}.pbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 0 var(--sh),0 2px 4px rgba(23,32,28,.08)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
  <sc-if value="{{ltInfo.open}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" onMouseDown="{{ltInfo.close}}" style="position: fixed; inset: 0; z-index: 44; background: rgba(23, 32, 28, 0.28)"></div>
    <div class="noprint" role="dialog" aria-label="레슨 유형별 횟수" style="font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-variant-numeric: tabular-nums; color: #17201C; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45; width: 400px; max-width: calc(100vw - 32px); max-height: calc(100vh - 60px); overflow: auto; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 22px; box-shadow: 0 24px 60px rgba(23, 32, 28, 0.22)">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; color: #8A949E">{{ltInfo.sub}}</span><span style="font-size: 18px; font-weight: 600; color: #17201C">레슨횟수</span></span>
        <span style="display: inline-flex; align-items: baseline; gap: 3px"><span style="font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: #17201C">{{ltInfo.total}}</span><span style="font-size: 15px; font-weight: 600; color: #5E6873">회</span></span>
      </div>
      <div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #EEF1F0; gap: 2px"><sc-for list="{{ltInfo.rows}}" as="r" hint-placeholder-count="2"><span style="{{r.bar}}"></span></sc-for></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ltInfo.rows}}" as="r" hint-placeholder-count="2"><div style="{{r.card}}"><span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{r.name}}</span><span style="font-size: 12px; opacity: 0.75">{{r.desc}}</span><sc-if value="{{r.who}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; white-space: normal; word-break: keep-all">{{r.who}}</span></sc-if></span><span style="flex: 1"></span><span style="display: inline-flex; align-items: baseline; gap: 2px"><span style="font-size: 28px; font-weight: 600; line-height: 1">{{r.n}}</span><span style="font-size: 13px; font-weight: 600">회</span></span><span style="width: 44px; text-align: right; font-size: 12px; font-weight: 600; opacity: 0.75">{{r.pct}}</span></div></sc-for>
      </div>
      <button type="button" onClick="{{ltInfo.close}}" style="height: 44px; border-radius: 13px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #3A4450; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">닫기</button>
    </div>
  </sc-if>
<div class="approot shell" style="display: flex; flex-direction: column; min-height: 100vh; font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C; background: #F3F5F4; font-variant-numeric: tabular-nums">

  <header class="noprint" style="background: #FFFFFF; border-bottom: 1px solid #C6CDC7; padding: 8px 24px 0; display: flex; flex-direction: column">
    <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <a href="{{t.href}}" style="{{t.style}}">{{t.label}}<span style="font-size: 11px; color: #66716A; margin-left: 4px">{{t.cnt}}</span></a>
      </sc-for>
    </nav>
  </header>

  <main class="shellmain" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 6px 28px 40px; box-sizing: border-box">


    <div role="tablist" aria-label="강사" class="noprint" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0 10px; border-bottom: 1px solid #DDE2DF">
      <sc-for list="{{teacherTabs}}" as="tt" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{tt.on}}" onClick="{{tt.pick}}" style="{{tt.style}}"><span style="{{tt.chip}}">{{tt.part}}</span>{{tt.name}}</button>
      </sc-for>
    </div>


    <sc-if value="{{isSheet}}" hint-placeholder-val="{{ true }}">
    <section aria-label="출석부" data-exp="1" class="shellsec" tabIndex="0" onKeyDown="{{onKey}}" style="outline: none; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; overflow: clip; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.05)">
      <div class="scronly" style="display: grid; flex: none; border-bottom: 1px solid #EBEEEC"><span style="{{hd.bar}}"><span style="{{hd.titleBox}}"><span style="{{hd.logo}}"><sc-if value="{{hd.isAtt}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></sc-if><sc-if value="{{hd.isClass}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h8M8 13h6"></path></svg></sc-if><sc-if value="{{hd.isWork}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5H5v16h14V5h-2M9 12l2 2 4-4"></path></svg></sc-if></span><span style="{{c.titleText}}">{{hd.title}}</span><span style="{{c.divider}}"></span><span style="{{c.month}}">{{monthLabel}}</span></span><span style="flex: 1 1 auto"></span><span class="noexp noprint" style="display: flex; align-items: center; gap: 8px; padding: 0 16px"><sc-for list="{{hd.nav}}" as="n" hint-placeholder-count="2"><button type="button" onClick="{{n.go}}" aria-label="{{n.label}}로 가기" style="{{n.style}}"><span style="{{n.icon}}"><sc-if value="{{n.isAtt}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></sc-if><sc-if value="{{n.isClass}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h8M8 13h6"></path></svg></sc-if><sc-if value="{{n.isWork}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5H5v16h14V5h-2M9 12l2 2 4-4"></path></svg></sc-if></span>{{n.label}}</button></sc-for></span><span role="button" tabindex="0" aria-label="레슨 유형별 횟수 보기" onClick="{{ltInfoOpen}}" style="{{hd.lesson}}; cursor: pointer"><span style="font-size: 12px; color: #5E6873">레슨횟수 <b style="font-weight: 600; color: #17201C">{{lessonCount}}</b></span><span style="display: flex; align-items: center; gap: 6px"><sc-for list="{{lessonTypesChips}}" as="lt" hint-placeholder-count="2"><span title="{{lt.title}}" style="{{lt.style}}">{{lt.n}}</span></sc-for></span></span><span style="{{hd.count}}"><span style="font-size: 12px; color: #5E6873">재원</span><span style="font-size: 18px; font-weight: 600; color: #1F7A5A">{{headCount}}명</span></span><span style="{{hd.teacher}}"><span style="{{teacherAvatar}}">{{teacherInitial}}</span><span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 14px; font-weight: 600; color: #17201C">{{teacherName}}</span><span style="font-size: 11px; color: #5E6873">{{teacherPart}}</span></span></span></span></div>
      <div id="sheetScroll" class="shellscroll"><div style="min-width: 1080px; font-size: 13px">

        <div class="phead" style="{{gridStyle}}">
          <span class="ponly" style="{{hd.bar}}"><span style="{{hd.titleBox}}"><span style="{{hd.logo}}"><sc-if value="{{hd.isAtt}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></sc-if><sc-if value="{{hd.isClass}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h8M8 13h6"></path></svg></sc-if><sc-if value="{{hd.isWork}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5H5v16h14V5h-2M9 12l2 2 4-4"></path></svg></sc-if></span><span style="{{c.titleText}}">{{hd.title}}</span><span style="{{c.divider}}"></span><span style="{{c.month}}">{{monthLabel}}</span></span><span style="flex: 1 1 auto"></span><span class="noexp noprint" style="display: flex; align-items: center; gap: 8px; padding: 0 16px"><sc-for list="{{hd.nav}}" as="n" hint-placeholder-count="2"><button type="button" onClick="{{n.go}}" aria-label="{{n.label}}로 가기" style="{{n.style}}"><span style="{{n.icon}}"><sc-if value="{{n.isAtt}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></sc-if><sc-if value="{{n.isClass}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h8M8 13h6"></path></svg></sc-if><sc-if value="{{n.isWork}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5H5v16h14V5h-2M9 12l2 2 4-4"></path></svg></sc-if></span>{{n.label}}</button></sc-for></span><span role="button" tabindex="0" aria-label="레슨 유형별 횟수 보기" onClick="{{ltInfoOpen}}" style="{{hd.lesson}}; cursor: pointer"><span style="font-size: 12px; color: #5E6873">레슨횟수 <b style="font-weight: 600; color: #17201C">{{lessonCount}}</b></span><span style="display: flex; align-items: center; gap: 6px"><sc-for list="{{lessonTypesChips}}" as="lt" hint-placeholder-count="2"><span title="{{lt.title}}" style="{{lt.style}}">{{lt.n}}</span></sc-for></span></span><span style="{{hd.count}}"><span style="font-size: 12px; color: #5E6873">재원</span><span style="font-size: 18px; font-weight: 600; color: #1F7A5A">{{headCount}}명</span></span><span style="{{hd.teacher}}"><span style="{{teacherAvatar}}">{{teacherInitial}}</span><span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 14px; font-weight: 600; color: #17201C">{{teacherName}}</span><span style="font-size: 11px; color: #5E6873">{{teacherPart}}</span></span></span></span>

          <span style="{{c.headName}}">요일</span>
          <span style="{{c.headName}}">이름<span class="cgrip noexp noprint" onMouseDown="{{c.rzName}}" onDblClick="{{c.rzNameReset}}" title="끌어서 폭 조절 · 두 번 누르면 원래 폭" style="position: absolute; top: 0; bottom: 0; right: -1px; width: 8px; cursor: col-resize"></span></span>
          <span style="{{c.headStart}}">수강<span class="cgrip noexp noprint" onMouseDown="{{c.rzTk}}" onDblClick="{{c.rzTkReset}}" title="끌어서 폭 조절 · 두 번 누르면 원래 폭" style="position: absolute; top: 0; bottom: 0; right: -1px; width: 8px; cursor: col-resize"></span></span>
          <sc-for list="{{days}}" as="h" hint-placeholder-count="30">
            <span style="{{h.cell}}"><span onClick="{{h.pick}}" title="이 날짜 세로줄 표시" style="{{h.style}}"><span>{{h.d}}</span><span style="font-size: 10px; font-weight: 600; line-height: 1; opacity: 0.85">{{h.wd}}</span></span></span>
          </sc-for>
          <sc-for list="{{fillers}}" as="fl" hint-placeholder-count="1"><span style="{{c.headLast}}"></span></sc-for>
        </div>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
          <sc-if value="{{g.sep}}" hint-placeholder-val="{{ false }}"><div class="grp grpsep" style="{{g.sepStyle}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: #9AA4AD"></span>휴원 · 퇴원 · 이동</div></sc-if>
          <div class="grp" style="{{g.boxStyle}}">
            <span style="{{g.dayCell}}"><span style="{{g.dayChip}}">{{g.label}}</span></span>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
              <div class="{{r.rowCls}}" style="display: contents">
                <span class="{{r.nameCls}}" style="{{r.nameStyle}}" onClick="{{r.quick}}"><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; line-height: 1.15"><span style="display: inline-flex; align-items: center; gap: 4px"><span>{{r.name}}</span><sc-if value="{{r.isNew}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 17px; padding: 0 5px; border-radius: 5px; background: #E3ECFD; color: #2952A3; font-size: 10px; font-weight: 600">신규</span></sc-if><sc-if value="{{r.cash}}" hint-placeholder-val="{{ false }}"><span title="현금영수증 발행" style="display: inline-flex; color: #00A6AB"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="현금영수증"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg></span></sc-if><sc-if value="{{r.flashTag}}" hint-placeholder-val="{{ false }}"><span class="flashtag" style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 2px; border-radius: 6px; background: #E6F6F6; color: #007E82; font-size: 10px; font-weight: 600; white-space: nowrap">{{r.flashTag}}</span></sc-if><span style="{{r.checkChip}}">{{r.check}}</span><span style="{{r.check2Chip}}">{{r.check2}}</span></span><sc-if value="{{r.hasTime}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; font-weight: 600; color: #6B7680; letter-spacing: -0.01em">{{r.time}}</span></sc-if><sc-if value="{{r.stTxt}}" hint-placeholder-val="{{ false }}"><span style="{{r.stStyle}}">{{r.stTxt}}</span></sc-if></span></span>
                <span class="{{r.tkCls}}" style="{{r.ticketCell}}" onClick="{{r.tkClick}}" title="{{r.tkTitle}}">
                  <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start">
                    <span style="display: flex; align-items: flex-end; gap: 5px"><span style="display: flex; flex-direction: column; gap: 3px"><sc-for list="{{r.dotLines}}" as="dl" hint-placeholder-count="1"><span style="display: flex; align-items: center; gap: 5px"><sc-for list="{{dl.groups}}" as="dg" hint-placeholder-count="2"><span style="display: flex; gap: 2px"><sc-for list="{{dg.dots}}" as="dd" hint-placeholder-count="4"><span style="{{dd.style}}"></span></sc-for></span></sc-for></span></sc-for></span><sc-if value="{{r.queueTxt}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 15px; padding: 0 5px; border-radius: 5px; background: #F3E6C4; color: #7A5C12; font-size: 9px; font-weight: 600; white-space: nowrap">{{r.queueTxt}}</span></sc-if></span>
                    <span style="font-size: 10px; letter-spacing: -0.02em; white-space: normal; line-height: 1.25"><sc-for list="{{r.subParts}}" as="sp" hint-placeholder-count="1"><span style="{{sp.style}}">{{sp.t}}</span></sc-for></span><sc-if value="{{r.lateLine}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 600; letter-spacing: -0.02em; color: #007E82; white-space: nowrap">{{r.lateLine}}</span></sc-if><sc-if value="{{r.diffLine}}" hint-placeholder-val="{{ false }}"><span style="{{r.diffStyle}}">{{r.diffLine}}</span></sc-if>
                  </span>
                </span>
                <sc-for list="{{r.cells}}" as="x" hint-placeholder-count="30">
                  <button type="button" data-cell="{{x.key}}" title="{{x.title}}" onMouseDown="{{x.down}}" onMouseEnter="{{x.enter}}" aria-label="{{x.label}}" aria-selected="{{x.selected}}" style="{{x.style}}"><span style="position: relative; display: inline-flex"><span style="{{x.chip}}">{{x.text}}</span><sc-if value="{{x.pdot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{x.pdot}}">₩</span></sc-if></span><sc-if value="{{x.hint}}" hint-placeholder-val="{{ false }}"><span class="noexp noprint" aria-hidden="true" style="{{x.hintStyle}}"><span>{{x.hint}}</span><span>{{x.hint2}}</span></span></sc-if></button>
                </sc-for>
                <sc-for list="{{fillers}}" as="fl" hint-placeholder-count="1"><span style="{{r.lastStyle}}"></span></sc-for>
              </div>
            </sc-for>
          </div>

          <button type="button" class="pbtn" onClick="{{pop.close}}" style="--sh: #D5DBD8; flex: 1; height: 54px; border-radius: 16px; border: 1px solid #DDE2DF; background: linear-gradient(180deg, #FFFFFF 0%, #F4F6F5 55%); color: #3A4450; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 4px">취소</button>
          <button type="button" class="pbtn" onClick="{{pop.confirmDel}}" style="--sh: #E9B3A5; flex: 1; height: 54px; border-radius: 16px; border: 1px solid #F3C8BC; background: linear-gradient(180deg, #FFFFFF 0%, #FCE3DC 55%); color: #C2410C; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 4px">삭제</button>
        </div>
        <div style="display: flex; justify-content: center; gap: 14px; font-size: 11px; color: #8A949E">
          <span><b style="font-weight: 600; color: #5E6873">Enter</b> 삭제</span>
          <span><b style="font-weight: 600; color: #5E6873">Esc</b> 취소</span>

        <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #F4F7FD; border: 1px solid #DCE5F7">
          <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #1E4FA8"><span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; background: #E3ECFD; font-size: 12px">보</span>보강 일정</span>
          <button type="button" role="switch" aria-checked="{{pop.mkOnStr}}" onClick="{{pop.toggleMk}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid #DCE5F7; background: #FFFFFF; font-family: inherit; cursor: pointer">
            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 14px; font-weight: 600; color: #17201C">보강 일정 정하기</span></span>
            <span style="{{pop.swTrack}}"><span style="{{pop.swKnob}}"></span></span>
          </button>
          <label for="mkDate" style="{{pop.lblStyle}}">보강 날짜</label>
          <input id="mkDate" type="date" disabled="{{pop.mkDis}}" defaultValue="{{pop.mkDate}}" style="{{pop.inOpacity}}; height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #D5DBD8; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #17201C">
          <span style="{{pop.lblStyle}}">보강 시간</span>
          <div style="display: flex; align-items: center; gap: 8px">
            <label for="mkHour" style="position: absolute; left: -9999px">시</label>
            <input id="mkHour" type="number" min="1" max="12" inputmode="numeric" disabled="{{pop.mkDis}}" defaultValue="{{pop.mkHour}}" style="{{pop.inOpacity}}; flex: 1; min-width: 0; text-align: center; height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #D5DBD8; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #17201C">
            <span style="{{pop.unitStyle}}">시</span>
            <label for="mkMin" style="position: absolute; left: -9999px">분</label>
            <input id="mkMin" type="number" min="0" max="59" step="5" inputmode="numeric" disabled="{{pop.mkDis}}" defaultValue="{{pop.mkMin}}" style="{{pop.inOpacity}}; flex: 1; min-width: 0; text-align: center; height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #D5DBD8; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #17201C">
            <span style="{{pop.unitStyle}}">분</span>
          </div>
          <span style="{{pop.hintStyle}}">시간 기본값은 원생의 수업 시간입니다.</span>
        </div>
        <div style="display: flex; gap: 10px">
          <button type="button" onClick="{{pop.back}}" style="flex: 1; height: 48px; border-radius: 13px; border: 1px solid #D5DBD8; background: #FFFFFF; color: #3A4450; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">뒤로</button>
          <button type="button" onClick="{{pop.saveMk}}" style="flex: 2; height: 48px; border-radius: 13px; border: none; background: #4A78C9; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{pop.saveLabel}}</button>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</template>
<script>
class DCLogic{constructor(props){this.props=props||{};this.state={}}
  setState(p){this.state=Object.assign({},this.state,p);render()}}
class Component extends DCLogic {
  // 달 번호(해 넘김): 2026년 1월 = 1 … 12월 = 12, 2027년 1월 = 13 … — 해가 바뀌어도 '다음 달' = +1
  ymK(k) { const y = 2026 + Math.floor((k - 1) / 12), m = ((k - 1) % 12 + 12) % 12 + 1; return y + '-' + String(m).padStart(2, '0'); }
  kY(k) { return 2026 + Math.floor((k - 1) / 12); }
  kM(k) { return ((k - 1) % 12 + 12) % 12 + 1; }
  kOf(s) { const m = /^(\d{4})-(\d{2})/.exec(s || ''); return m ? (+m[1] - 2026) * 12 + +m[2] : 0; }
  kLabel(k) { return this.kY(k) + '년 ' + this.kM(k) + '월'; }
  constructor(props) {
    super(props);
    this.dragging = false;
    this.state = {
      qe: null,
      hvName: null,
      shared: this.readShared(),
      statusList: this.readStatus(),
      ast: null,
      pay: null,
      tkp: null,
      tinfo: null,
      cashNotice: null,
      printOpen: false,
      printLayout: 'fit',
      printBW: true,
      hiddenSheets: [],
      sheetCtx: null,
      sheetList: false,
      sheetListTab: 'att',
      sel: null,
      past: [],
      future: [],
      pop: null,
      mkTimes: {},
      mkLinks: {},
      teacher: 0,
      sheet: 0,
      extra: [],
      evByMonth: {},
      // 출석은 원장님이 직접 테스트하도록 비워 둠 (샘플 출결 없음)
      ev: {}
    };
    if (this.dbMode()) Object.assign(this.state, this.cellsState());
    try { Object.assign(this.state, this.sheetFor(0)); } catch (e) {}
    // 새로고침·처음 열 때는 항상 '오늘이 든 달' 출석부로 (그 달 시트가 없으면 맨 왼쪽 시트)
    try { const L0 = this.sheetList(0), ci = L0.findIndex(x => x[1] === this.kOf(this.todayYmd())); if (ci >= 0) this.state.sheet = ci; } catch (e) {}
  }
  // ---------- 출석부 저장 (로그인 사이트) ----------
  // 화면의 출결·수납 표시와 보강 시간을 원생('D'+원생번호)·달별로 'academy.attCells'에 써 두면 db.js가 Supabase(attendance_cells)에 저장한다.
  dbMode() { const A = window.academy; return !!(A && A.data && Array.isArray(A.data.students)); }
  cellsState() {
    let ac = {};
    try { ac = JSON.parse(localStorage.getItem('academy.attCells') || '{}') || {}; } catch (e) {}
    const ev = {}, bm = {}, mk = {}, ml = {}, months = [];
    Object.keys(ac).forEach(ym => {
      const m = this.kOf(ym);
      if (!m) return;
      if (months.indexOf(m) < 0) months.push(m);
      const tgt = m === 11 ? ev : (bm[m] = bm[m] || {});
      // 원생('D'+번호)마다 { 줄 id: 칸 내용, _mk: {'날짜-줄 id': 보강 시간}, _ml: {'날짜-줄 id': 보강 날짜} }
      Object.keys(ac[ym] || {}).forEach(sk => {
        const c = ac[ym][sk] || {};
        Object.keys(c).forEach(rid => { if (rid !== '_mk' && rid !== '_ml' && c[rid] && Object.keys(c[rid]).length) tgt[rid] = Object.assign({}, c[rid]); });
        Object.keys(c._mk || {}).forEach(k => { mk[m + '-' + k] = c._mk[k]; });
        Object.keys(c._ml || {}).forEach(k => { ml[m + '-' + k] = c._ml[k]; });
      });
    });
    const extra = (this.state && this.state.extra || []).concat(months.filter(m => m > 11 || m < 9)).filter((m, i, a) => a.indexOf(m) === i).sort((a, b) => b - a);
    return { ev: ev, evByMonth: bm, mkTimes: mk, mkLinks: ml, extra: extra };
  }
  buildCells() {
    // 줄 id 'D12-화' → 원생 키 'D12' (로그인 사이트 원생 줄만 저장)
    const st = this.state, ac = {}, skOf = rid => { const m = /^([DX]\d+)(-|$)/.exec(String(rid)); return m ? m[1] : null; };
    const put = (m, sk) => { const ym = this.ymK(m); ac[ym] = ac[ym] || {}; return (ac[ym][sk] = ac[ym][sk] || {}); };
    [[11, st.ev]].concat(Object.keys(st.evByMonth || {}).filter(m => +m !== 11).map(m => [+m, st.evByMonth[m]])).forEach(p => {
      Object.keys(p[1] || {}).forEach(rid => { const r = p[1][rid], sk = skOf(rid); if (sk && r && Object.keys(r).length) put(p[0], sk)[rid] = r; });
    });
    [['_mk', st.mkTimes], ['_ml', st.mkLinks]].forEach(p => {
      Object.keys(p[1] || {}).forEach(k => { const a = k.split('-'), rest = a.slice(1).join('-'), sk = skOf(a.slice(2).join('-')); if (!sk || !p[1][k]) return; const o = put(+a[0], sk); (o[p[0]] = o[p[0]] || {})[rest] = p[1][k]; });
    });
    return ac;
  }
  // 월 마감('academy.monthClose' / Supabase app_settings 'monthClose', 원장님만): { '2026-11|강사': { at, by, snaps: { 원생키: { out, s: 수강권 상태 } } } }
  readAttMemo() { try { return JSON.parse(localStorage.getItem('academy.attMemo') || '{}') || {}; } catch (e) { return {}; } }
  saveAttMemo(me, text) {
    const all = this.readAttMemo(), v = String(text || '').replace(/\s+$/, '');
    if ((all[me] || '') === v) return;
    if (v) all[me] = v; else delete all[me];
    try { localStorage.setItem('academy.attMemo', JSON.stringify(all)); } catch (e) {}
  }
  isOwner() { const A = window.academy; return !this.dbMode() || !!(A && A.staff && A.staff.role === 'owner'); }
  // 미납 정리('academy.writeOffs' / app_settings 'writeOffs', 원장님만): 가장 최근 휴원·퇴원 뒤에 정리한 기록
  readWriteOffs() { try { const v = JSON.parse(localStorage.getItem('academy.writeOffs') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  woOf(name) {
    const st = (this.state.statusList || []).filter(e => e.name === name && (e.kind === 'rest' || e.kind === 'out')).sort((a, b) => (a.at || 0) - (b.at || 0)).pop();
    if (!st) return null;
    return this.readWriteOffs().filter(w => w.name === name && (w.at || 0) >= (st.at || 0)).pop() || null;
  }
  saveWriteOff(name, n, diff, on) {
    const A = window.academy, w0 = this.woOf(name);
    let list = this.readWriteOffs();
    if (on) list = list.concat([{ id: 'W' + Date.now(), at: Date.now(), name: name, date: this.todayYmd(), n: n || 0, diff: diff || 0, by: (A && A.staff && A.staff.name) || '원장님' }]);
    else if (w0) list = list.filter(w => w.id !== w0.id);
    try { localStorage.setItem('academy.writeOffs', JSON.stringify(list)); } catch (e) {}
    this.setState({});
  }
  // 휴원·퇴원 날짜 고치기: 같은 기록의 날짜만 바꾼다 (DB는 academy.updateStatusDate)
  saveStatusDate(S, date) {
    const list = this.readStatus(), e = list.find(x => x.id === S.editId); if (!e) return;
    e.date = date;
    try { localStorage.setItem('academy.statusChanges', JSON.stringify(list)); } catch (x) {}
    const A = window.academy; if (A && A.updateStatusDate) A.updateStatusDate(e.id, date);
    this.setState({ statusList: list, ast: Object.assign({}, S, { editDate: date, editDate2: '', editSaved: true }) });
  }
  // 휴원·퇴원 기간 [시작, 끝(복귀·재등록 날짜, 없으면 null)] — 처리한 순서대로
  statusLocks(name) {
    const L = (this.state.statusList || []).filter(e => e.name === name).sort((a, b) => (a.at || 0) - (b.at || 0));
    const out = []; let open = null;
    L.forEach(e => { if (e.kind === 'rest' || e.kind === 'out') { if (!open) open = e.date; } else if (e.kind === 'back' && open) { out.push([open, e.date]); open = null; } });
    if (open) out.push([open, null]);
    return out;
  }
  readCloses() { try { return JSON.parse(localStorage.getItem('academy.monthClose') || '{}') || {}; } catch (e) { return {}; } }
  saveClose(ck, on) {
    const all = this.readCloses(), A = window.academy;
    if (on) all[ck] = { at: Date.now(), by: (A && A.staff && A.staff.name) || '원장님', snaps: Object.assign({}, this._curSnaps || {}) };
    else delete all[ck];
    try { localStorage.setItem('academy.monthClose', JSON.stringify(all)); } catch (e) {}
    this.setState({ mcDlg: null });
  }
  closedNote(m) {
    const me = (this.tKey() || '').replace(' 원장님', ''), ck = this.ymK(m) + '|' + me;
    if (!this.readCloses()[ck]) return;
    this._mcNoted = this._mcNoted || {};
    if (this._mcNoted[ck]) return;
    this._mcNoted[ck] = true;
    setTimeout(() => this.setState({ mcDlg: { kind: 'note' } }), 0);
  }
  // 출결 칸 주인(강사 월급과 이어짐): 새로 적거나 바꾼 칸에 지금 보고 있는 강사 탭 이름('by'+날짜)을 적어 둔다
  stampCells(src) {
    const st = src || this.state, me = (this.tKey() || '').replace(' 원장님', '');
    const months = [[11, st.ev]].concat(Object.keys(st.evByMonth || {}).filter(m => +m !== 11).map(m => [+m, st.evByMonth[m]]));
    const snap = this._snap, next = {};
    months.forEach(p => { const m = p[0], ev = p[1] || {}; next[m] = {};
      Object.keys(ev).forEach(rid => { const row = ev[rid] || {}, old = snap && (snap[m] || {})[rid];
        if (snap && me) Object.keys(row).forEach(k => { const mm = /^(?:p|s|u|dp)?(\d+)$/.exec(k); if (!mm || !row[k] || (old && old[k] === row[k])) return; row['by' + mm[1]] = me; this.closedNote(m); });
        if (snap && old) Object.keys(old).forEach(k => { if (/^(?:p|s|u|dp)?\d+$/.test(k) && old[k] && !row[k]) this.closedNote(m); });
        next[m][rid] = Object.assign({}, row); }); });
    this._snap = next;
  }
  persistCells() {
    const st = this.state, refs = [st.ev, st.evByMonth, st.mkTimes, st.mkLinks];
    if (this._pc && this._pc.every((x, i) => x === refs[i])) return;
    this.stampCells();
    const first = !this._pc;
    this._pc = refs;
    if (first) return;
    clearTimeout(this._pcT);
    this._pcT = setTimeout(() => {
      const js = JSON.stringify(this.buildCells());
      let cur = '';
      try { cur = localStorage.getItem('academy.attCells') || ''; } catch (e) {}
      if (js !== cur) { this.logCells(cur, js); try { localStorage.setItem('academy.attCells', js); } catch (e) {} }
    }, 250);
  }
  // 맨 아래 시트 탭은 강사마다 따로 기억한다: 보고 있던 시트·숨긴 시트(이 브라우저 'attendance.sheetByTeacher'), 탭 순서('attendance.tabOrder.강사')
  tKey(i) { const L = this.teacherList(); return ((L[Math.min(i == null ? (this.state.teacher || 0) : i, L.length - 1)] || [])[0]) || ''; }
  sheetMem() { try { return JSON.parse(localStorage.getItem('attendance.sheetByTeacher') || '{}') || {}; } catch (e) { return {}; } }
  sheetFor(i) {
    const m = this.sheetMem()[this.tKey(i)] || {};
    const L = this.sheetList(i), k = L.findIndex(x => x[0] === m.sheet);
    return { sheet: k >= 0 ? k : 0, hiddenSheets: Array.isArray(m.hidden) ? m.hidden : [] };
  }
  pickTeacher(i) {
    if (i === (this.state.teacher || 0)) return;
    const al = this.logAllow(i), lv = this.state.logView;
    this.setState(Object.assign({ teacher: i, sel: null, sheetCtx: null, sheetList: false, logView: (lv === 'class' && al.cls) || (lv === 'work' && al.work) ? lv : null }, this.sheetFor(i)));
  }
  // ---------- 수업일지 · 업무일지 (맨 아래 시트 탭) ----------
  // 수업일지 = 직명 원장 강사 탭에만, 업무일지 = 직명 원장·행정 강사 탭에만. 나머지 강사 탭에는 출석부 시트만 나온다.
  logAllow(i) {
    const L = this.teacherList(), t = L[Math.min(i == null ? (this.state.teacher || 0) : i, L.length - 1)] || [];
    const nm = String(t[0] || '').replace(' 원장님', '');
    const e = this.employeeList().find(x => x.name === nm);
    const ti = e ? (Array.isArray(e.titles) && e.titles.length ? e.titles : [e.role]) : (t[1] === '원장' ? ['원장'] : []);
    const own = ti.indexOf('원장') >= 0;
    return { cls: own, work: own || ti.indexOf('행정') >= 0 };
  }
  readLog(key, def) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v && typeof v === 'object' ? v : def; } catch (e) { return def; } }
  writeLog(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} this.setState({ logTick: Date.now() }); }
  ymOf(m) { return this.ymK(m); }
  // 출석부와 같은 순서: 요일 묶음(월~토, R, 휴원·퇴원·이동) 안에서 시간 순서, 시간 없으면 가나다
  attOrder(all) {
    const GROUPS = ['월', '화', '수', '목', '금', '토', 'R', '체험', '휴원', '퇴원', '이동'];
    const OUTG = { '휴원': '휴원', '퇴원': '퇴원', '강사 변경': '이동' };
    const grpOf = s => s.g === '퇴휴' ? (OUTG[s.status] || '퇴원') : s.g;
    const tmin = s => { const m0 = /^(\d{1,2}):(\d{2})$/.exec(s.time || ''); return m0 ? +m0[1] * 60 + +m0[2] : Infinity; };
    const sortName = s => s.name.replace('$', '').replace(/^[A-Za-z]\)/, '');
    return GROUPS.map(g => {
      const isOut = ['휴원', '퇴원', '이동'].indexOf(g) >= 0;
      const rows = all.filter(s => grpOf(s) === g).sort((a, b) => isOut
        ? ((a.outDate || '') < (b.outDate || '') ? -1 : (a.outDate || '') > (b.outDate || '') ? 1 : sortName(a).localeCompare(sortName(b), 'ko'))
        : ((tmin(a) - tmin(b)) || sortName(a).localeCompare(sortName(b), 'ko')));
      return { g: g, rows: rows };
    }).filter(x => x.rows.length);
  }
  // 수업일지: 출석부와 같은 줄(요일 묶음 · 순서, 요일 칸은 묶음마다 하나로 합침) × 그 달 주차(월요일 시작).
  // 칸에는 출석부에 출결을 넣은 날만 나온다: 출석이면 수업 내용을 적고(글이 길어도 다 보임), 결석·연기는 표시만. 보강은 넣지 않는다.
  classLogVals(m) {
    const ym = this.ymOf(m);
    const nd = new Date(2026, m, 0).getDate(), first = new Date(2026, m - 1, 1).getDay(), off = (first + 6) % 7;
    const nW = Math.ceil((nd + off) / 7);
    // 일요일 하루뿐인 주(예: 달의 첫날이 일요일)는 수업이 없으므로 칸을 만들지 않는다
    const KEEP = [];
    for (let w = 0; w < nW; w++) { const a = Math.max(1, w * 7 - off + 1), b = Math.min(nd, w * 7 - off + 7); let k = false; for (let d = a; d <= b; d++) if (new Date(2026, m - 1, d).getDay() !== 0) k = true; KEEP.push(k); }
    const WD = ['일', '월', '화', '수', '목', '금', '토'];
    const LOG = this.readLog('academy.classLog', {}), LM = LOG[ym] || {};
    const t0 = new Date(), today = (t0.getFullYear() - 2026) * 12 + t0.getMonth() + 1 === m ? t0.getDate() : 0;

  if(node.nodeType===3){out.appendChild(document.createTextNode(interp(node.nodeValue,scope)));return}
  if(node.nodeType!==1)return;
  const tag=node.tagName.toLowerCase();
  if(tag==='sc-for'){const list=look(scope,node.getAttribute('list').replace(/[{}]/g,''))||[];const as=node.getAttribute('as');
    list.forEach((it,i)=>{const s=Object.create(scope);s[as]=it;s.$index=i;node.childNodes.forEach(ch=>build(ch,s,out))});return}
  if(tag==='sc-if'){if(look(scope,node.getAttribute('value').replace(/[{}]/g,'')))node.childNodes.forEach(ch=>build(ch,scope,out));return}
  const el=document.createElementNS(node.namespaceURI,node.localName);
  for(const a of node.attributes){
    if(/^on[A-Z]/.test(a.name)||/^on[a-z]/.test(a.name)&&a.value.includes('{{')){const fn=interp(a.value,scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);continue}
    if(a.name.startsWith('hint-'))continue;
    if(a.name==='disabled'){const dv=interp(a.value,scope);if(dv===true||dv==='true')el.setAttribute('disabled','');continue;}
    if(a.name==='defaultvalue'){el.setAttribute('value',interp(a.value,scope));continue;}
    el.setAttribute(a.name,interp(a.value,scope))}
  if(tag==='textarea'){el.value=interp(node.textContent,scope);out.appendChild(el);return}
  node.childNodes.forEach(ch=>build(ch,scope,el));out.appendChild(el)}
function render(){const app=document.getElementById('app');const keepS=[...app.querySelectorAll('[id]')].filter(e=>e.scrollTop||e.scrollLeft).map(e=>[e.id,e.scrollTop,e.scrollLeft]);const wy=window.scrollY,wx=window.scrollX;const hadFocus=!!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('section[tabindex]'));const keepX=[...app.querySelectorAll('section')].map(s=>s.scrollLeft);
  const frag=document.createDocumentFragment();const vals=comp.renderVals();
  tpl.content.childNodes.forEach(ch=>build(ch,vals,frag));app.replaceChildren(frag);keepS.forEach(([i,t,l])=>{const e=document.getElementById(i);if(e){e.scrollTop=t;e.scrollLeft=l}});if(hadFocus){const sf=app.querySelector('section[tabindex]');if(sf)sf.focus({preventScroll:true});}
  app.querySelectorAll('section').forEach((s,i)=>{if(keepX[i])s.scrollLeft=keepX[i]});if(window.scrollY!==wy||window.scrollX!==wx)window.scrollTo(wx,wy)}
render();
