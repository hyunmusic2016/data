<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학원 출석부</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
body{margin:0;background:#F3F5F4}
a{color:#1F7A5A}a:hover{color:#165C43}
button{font-family:inherit}
button:focus-visible{outline:2px solid #2563EB;outline-offset:-2px}
@page{size:A4 landscape;margin:7mm}html.bwp section[aria-label="출석부"] *{color:#000!important;background-color:transparent!important;background-image:none!important}html.bwp section[aria-label="출석부"] [style*="1.5px solid"]{border-color:#000!important}html.bwp section[aria-label="출석부"] [style*="background: #00A6AB"],html.bwp section[aria-label="출석부"] [style*="background: #E0605A"]{background-color:#000!important}html.bwp section[aria-label="출석부"] [style*="#E2C35E"]{box-shadow:inset 0 0 0 2px #000!important}html.bwp section[aria-label="출석부"] [style*="background: #00A6AB"][style*="color: #FFFFFF"],html.bwp section[aria-label="출석부"] [style*="background: #00A6AB; color: #FFFFFF"]{background-color:transparent!important;box-shadow:inset 0 0 0 1.5px #000!important}@media print{.noprint{display:none!important}.approot{min-height:0!important}html,body{background:#FFFFFF!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0!important;gap:0!important}section[aria-label="출석부"]{box-shadow:none!important;overflow:visible!important;border-radius:0!important}}
.pbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 0 var(--sh),0 8px 16px rgba(23,32,28,.08);transition:transform .07s ease,box-shadow .07s ease;-webkit-tap-highlight-color:transparent}.pbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 0 var(--sh),0 2px 4px rgba(23,32,28,.08)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="approot" style="display: flex; flex-direction: column; min-height: 100vh; font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C; background: #F3F5F4; font-variant-numeric: tabular-nums">

  <header class="noprint" style="background: #FFFFFF; border-bottom: 1px solid #C6CDC7; padding: 8px 24px 0; display: flex; flex-direction: column">
    <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <a href="{{t.href}}" style="{{t.style}}">{{t.label}}<span style="font-size: 11px; color: #66716A; margin-left: 4px">{{t.cnt}}</span></a>
      </sc-for>
    </nav>
  </header>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 6px 28px 40px; box-sizing: border-box">


    <div role="tablist" aria-label="강사" class="noprint" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0 10px; border-bottom: 1px solid #DDE2DF">
      <sc-for list="{{teacherTabs}}" as="tt" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{tt.on}}" onClick="{{tt.pick}}" style="{{tt.style}}"><span style="{{tt.chip}}">{{tt.part}}</span>{{tt.name}}</button>
      </sc-for>
    </div>


    <sc-if value="{{isSheet}}" hint-placeholder-val="{{ true }}">
    <section aria-label="출석부" tabIndex="0" onKeyDown="{{onKey}}" style="outline: none; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; overflow-x: auto; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.05)">
      <div style="min-width: 1080px; font-size: 13px">

        <div class="phead" style="{{gridStyle}}">
          <span style="{{c.title}}">
            <span style="{{c.logo}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></span>
            <span style="{{c.titleText}}">현실용음악학원 출석부</span>
            <span style="{{c.divider}}"></span>
            <span style="{{c.month}}">{{monthLabel}}</span>
          </span>
          <span style="{{c.spacer}}"></span>
          <span style="{{c.lessonCell}}">
            <span style="font-size: 12px; color: #5E6873">레슨횟수 <b style="color: #17201C">{{lessonCount}}</b></span>
            <span style="display: flex; align-items: center; gap: 6px">
              <span title="취미반" style="display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 26px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #E2F1EA; color: #1F7A5A; font-size: 15px; font-weight: 800">{{lessonHobby}}</span>
              <span title="전문반" style="display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 26px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #FCE4E6; color: #C8323C; font-size: 15px; font-weight: 800">{{lessonPro}}</span>
            </span>
          </span>
          <span style="{{c.countCell}}"><span style="font-size: 12px; color: #5E6873">재원</span><span style="font-size: 18px; font-weight: 700; color: #1F7A5A">{{headCount}}명</span></span>
          <span style="{{c.teacherCell}}"><span style="{{teacherAvatar}}">{{teacherInitial}}</span><span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 14px; font-weight: 700; color: #17201C">{{teacherName}}</span><span style="font-size: 11px; color: #5E6873">{{teacherPart}}</span></span></span>

          <span style="{{c.headName}}">요일</span>
          <span style="{{c.headName}}">이름</span>
          <span style="{{c.headStart}}">수강권</span>
          <sc-for list="{{days}}" as="h" hint-placeholder-count="30">
            <span style="{{h.cell}}"><span style="{{h.style}}">{{h.d}}</span></span>
          </sc-for>
          <sc-for list="{{fillers}}" as="fl" hint-placeholder-count="1"><span style="{{c.headLast}}"></span></sc-for>
        </div>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
          <div class="grp" style="{{g.boxStyle}}">
            <span style="{{g.dayCell}}"><span style="{{g.dayChip}}">{{g.label}}</span><span style="{{g.countStyle}}">{{g.count}}</span></span>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
              <div style="display: contents">
                <span style="{{r.nameStyle}}"><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; line-height: 1.15"><span style="display: inline-flex; align-items: center; gap: 4px"><span>{{r.name}}</span><sc-if value="{{r.cash}}" hint-placeholder-val="{{ false }}"><span title="현금영수증 발행" style="display: inline-flex; color: #00A6AB"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="현금영수증"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg></span></sc-if></span><sc-if value="{{r.hasTime}}" hint-placeholder-val="{{ true }}"><span style="font-size: 10px; font-weight: 600; color: #8A949E; letter-spacing: -0.01em">{{r.time}}</span></sc-if></span><span style="{{r.checkChip}}">{{r.check}}</span></span>
                <span style="{{r.ticketCell}}">
                  <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start">
                    <span style="display: flex; align-items: center; gap: 5px"><sc-for list="{{r.dotGroups}}" as="dg" hint-placeholder-count="1"><span style="display: flex; gap: 2px"><sc-for list="{{dg.dots}}" as="dd" hint-placeholder-count="4"><span style="{{dd.style}}"></span></sc-for></span></sc-for></span>
                    <span style="{{r.subStyle}}">{{r.subText}}</span>
                  </span>
                </span>
                <sc-for list="{{r.cells}}" as="x" hint-placeholder-count="30">
                  <button type="button" data-cell="{{x.key}}" title="{{x.title}}" onMouseDown="{{x.down}}" onMouseEnter="{{x.enter}}" aria-label="{{x.label}}" aria-selected="{{x.selected}}" style="{{x.style}}"><span style="{{x.chip}}">{{x.text}}</span></button>
                </sc-for>
                <sc-for list="{{fillers}}" as="fl" hint-placeholder-count="1"><span style="{{r.lastStyle}}"></span></sc-for>
              </div>
            </sc-for>
          </div>
        </sc-for>

        <div class="pnote" style="display: grid; grid-template-columns: 132px 304px minmax(0, 1fr); border-top: 1px solid #E1E6E3; background: #FAFBFA; min-height: 100px">
          <span style="display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #3A4450">비고</span>
          <span style="padding: 22px 0 0 8px; font-size: 12px; line-height: 1.5; white-space: pre-line; color: #3A4450">* 김재윤(월) (11월9일 기준) 6/8
* 정다온(월) (11월9일 기준) 3/8
* 소율,소민(금) (11월6일 기준) 9/8</span>
          <span style="padding: 40px 0 0 8px; font-size: 12px; color: #3A4450">* 김예나 2회 수업 (11/2 : 결석, 11/9 : 수업)</span>
        </div>
      </div>
    </section>
    <div class="noprint" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px">
      </div>
      <div class="noprint" style="display: flex; align-items: center; gap: 8px">
      <button type="button" onClick="{{printX}}" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"></path></svg>
        인쇄
      </button>
      <button type="button" onClick="{{exportX}}" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
        엑셀로 내보내기
      </button>
      </div>
    </div>
    </sc-if>
    <sc-if value="{{isLog}}" hint-placeholder-val="{{ false }}">
      <section aria-label="{{activeName}}" style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #E6F6F6; color: #00A6AB; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM9 9h6M9 13h6M9 17h4"></path></svg></span>
        <span style="font-size: 18px; font-weight: 700">{{activeName}}</span>
        <span style="font-size: 14px; color: #5E6873">수업진행표·업무일지 화면은 다음 시안에서 만듭니다.</span>
      </section>
    </sc-if>
  </main>

  <nav aria-label="시트" class="noprint" style="position: sticky; bottom: 0; z-index: 5; display: flex; align-items: stretch; gap: 2px; background: #FFFFFF; border-top: 1px solid #DDE2DF; padding: 0 12px; box-shadow: 0 -2px 8px rgba(23, 32, 28, 0.04); overflow-x: auto">
    <button type="button" onClick="{{addSheet}}" aria-label="새 달 출석부 추가" style="width: 30px; flex: none; border: none; background: none; color: #5E6873; font-size: 16px; cursor: pointer">+</button>
    <button type="button" onClick="{{sm.toggleList}}" aria-label="모든 시트" style="width: 30px; flex: none; border: none; background: none; color: #5E6873; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span style="width: 1px; background: #E1E6E3; margin: 8px 4px"></span>
    <sc-for list="{{sheetTabs}}" as="t" hint-placeholder-count="5">
      <button type="button" onClick="{{t.pick}}" onContextMenu="{{t.ctx}}" aria-pressed="{{t.on}}" style="{{t.style}}"><span style="{{t.dot}}"></span>{{t.name}}</button>
    </sc-for>
    <span style="margin-left: auto; flex: none; align-self: center; padding: 0 4px 0 16px; font-size: 11px; color: #8A949E; white-space: nowrap">v0.15.2</span>
  </nav>
  <sc-if value="{{cn.open}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" onMouseDown="{{cn.close}}" style="position: fixed; inset: 0; z-index: 44; background: rgba(23, 32, 28, 0.28)"></div>
    <div class="noprint" role="alertdialog" aria-label="현금영수증 발급 안내" onKeyDown="{{cn.key}}" tabIndex="-1" id="cashNotice" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45; width: 400px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 24px; box-shadow: 0 24px 60px rgba(23, 32, 28, 0.24); outline: none">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F3E6C4; color: #7A5C12; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 800; color: #17201C">현금영수증 발급 대상자입니다</span><span style="font-size: 13px; color: #5E6873">학원 단말기로 현금영수증을 발급해 주세요.</span></span>
      </div>
      <sc-for list="{{cn.items}}" as="it" hint-placeholder-count="1">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: #FBF6E8; border: 1px solid #EAD9A6">
          <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 800; color: #17201C">{{it.name}}</span><span style="font-size: 12px; color: #7A5C12">{{it.type}}</span></span>
          <span style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5E6873">발급 금액</span><b style="color: #17201C; font-size: 16px">{{it.amount}}</b></span>
          <span style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5E6873">발급 번호</span><b style="color: #17201C; font-size: 16px; letter-spacing: 0.02em">{{it.no}}</b></span>
        </div>
      </sc-for>
      <button type="button" class="pbtn" onClick="{{cn.close}}" style="--sh: #E0CB8F; height: 50px; border-radius: 15px; border: 1px solid #EAD9A6; background: linear-gradient(180deg, #FFFFFF 0%, #F7EED3 55%); color: #7A5C12; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 4px">확인</button>
    </div>
  </sc-if>
  <sc-if value="{{pr.open}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" onMouseDown="{{pr.close}}" style="position: fixed; inset: 0; z-index: 40; background: rgba(23, 32, 28, 0.22)"></div>
    <div class="noprint" role="dialog" aria-label="인쇄 설정" onKeyDown="{{pr.key}}" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 41; width: 380px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 24px; box-shadow: 0 24px 60px rgba(23, 32, 28, 0.22)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 18px; font-weight: 800; color: #17201C">인쇄</span>
        <button type="button" onClick="{{pr.close}}" aria-label="닫기" style="width: 32px; height: 32px; border-radius: 10px; border: 1px solid #E1E6E3; background: #FFFFFF; color: #5E6873; cursor: pointer; font-size: 16px; line-height: 1">×</button>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #5E6873">레이아웃 · A4 가로</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{pr.layouts}}" as="o" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}"><span style="{{o.radio}}"></span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 14px; font-weight: 700; color: #17201C">{{o.label}}</span><span style="font-size: 12px; color: #5E6873">{{o.desc}}</span></span></button>
        </sc-for>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #5E6873">색상</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{pr.colors}}" as="o" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}; flex: 1"><span style="{{o.radio}}"></span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 14px; font-weight: 700; color: #17201C">{{o.label}}</span><span style="font-size: 12px; color: #5E6873">{{o.desc}}</span></span></button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 4px">
        <button type="button" class="pbtn" onClick="{{pr.close}}" style="--sh: #D5DBD8; flex: 1; height: 50px; border-radius: 15px; border: 1px solid #DDE2DF; background: linear-gradient(180deg, #FFFFFF 0%, #F4F6F5 55%); color: #3A4450; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 4px">취소</button>
        <button type="button" class="pbtn" onClick="{{pr.go}}" style="--sh: #8FCFD1; flex: 2; height: 50px; border-radius: 15px; border: 1px solid #A9DCDE; background: linear-gradient(180deg, #FFFFFF 0%, #DDF3F3 55%); color: #007E82; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 4px">인쇄하기</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{sm.anyOpen}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" onMouseDown="{{sm.closeAll}}" onContextMenu="{{sm.closeAll}}" style="position: fixed; inset: 0; z-index: 30"></div>
  </sc-if>
  <sc-if value="{{sm.ctxOpen}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" role="menu" style="{{sm.ctxStyle}}">
      <button type="button" role="menuitem" onClick="{{sm.hide}}" disabled="{{sm.hideDis}}" style="{{sm.hideStyle}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4 10 7a11 11 0 0 1-2.7 3.9M6.1 6.1A11 11 0 0 0 2 12c1 3 5 7 10 7a9.8 9.8 0 0 0 4.1-.9"></path></svg>
        시트 숨기기
      </button>
    </div>
  </sc-if>
  <sc-if value="{{sm.listOpen}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" role="menu" aria-label="모든 시트" style="position: fixed; left: 12px; bottom: 44px; z-index: 31; width: 300px; max-height: 60vh; overflow: auto; padding: 6px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; box-shadow: 0 12px 32px rgba(23, 32, 28, 0.16)">
      <div role="tablist" aria-label="시트 종류" style="display: flex; gap: 4px; padding: 4px; margin-bottom: 4px; border-radius: 9px; background: #F1F3F2">
        <sc-for list="{{sm.kinds}}" as="k" hint-placeholder-count="2">
          <button type="button" role="tab" aria-selected="{{k.on}}" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}<span style="{{k.cntStyle}}">{{k.cnt}}</span></button>
        </sc-for>
      </div>
      <div style="padding: 4px 10px 6px; font-size: 11px; font-weight: 600; color: #8A949E">최신순</div>
      <sc-for list="{{sm.items}}" as="it" hint-placeholder-count="5">
        <button type="button" role="menuitem" onClick="{{it.pick}}" style="{{it.style}}"><span style="{{it.dot}}"></span><span style="flex: 1; text-align: left; white-space: nowrap">{{it.name}}</span><span style="{{it.tagStyle}}">숨김</span></button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{pop.open}}" hint-placeholder-val="{{ false }}">
    <div onMouseDown="{{pop.close}}" style="position: fixed; inset: 0; z-index: 40; background: rgba(23, 32, 28, 0.22)"></div>
    <div role="dialog" aria-label="출결 입력" onKeyDown="{{pop.key}}" style="{{pop.style}}">

<script>
class DCLogic{constructor(props){this.props=props||{};this.state={}}
  setState(p){this.state=Object.assign({},this.state,p);render()}}
class Component extends DCLogic {
  constructor(props) {

      evByMonth: {},

        1: { 2: '보', 7: '수', 9: '보' },

        20: { 7: '수' },
        21: { 7: '수' },
        22: { 6: '수', 10: '수' },
        23: { 6: '수' },
        24: { 4: '수', 5: 'V', 10: '수' },
        25: { 2: '수' },
        26: { 4: '연' },

  }
  students() {
    const P = '#DCD3EE';

      { id: 5, g: '화', name: '마서윤', start: 2, unpaid: true },

      { id: 29, sid: 'S29', g: '화', name: '한지우', start: 1, since: '10/20', time: '16:00' },
      { id: 8, g: '수', name: '윤가람', start: 3, since: '11/11' },

      { id: 10, g: '수', name: '강도윤', start: 1, since: '10/28' },

      { id: 18, g: '금', name: '이소민', start: 1, since: '', nameBg: P },
      { id: 19, g: '금', name: '이서준', start: 1, since: '10/30' },
      { id: 30, sid: 'S29', g: '금', name: '한지우', start: 1, since: '10/20', time: '18:30' },
      { id: 20, g: '토', name: '전태윤', start: 3, since: '' },
      { id: 21, g: '토', name: '김재희', start: 1, since: '' },
      { id: 22, g: 'R', name: '장현우', start: 1, since: '' },
      { id: 23, g: 'R', name: '이시윤', start: 2, unpaid: true },
      { id: 24, g: 'R', name: '방예준$', start: 3, since: '11/10' },
      { id: 25, g: 'R', name: '조민아', start: 1, since: '' },
      { id: 26, g: 'R', name: '강준호', start: 3, since: '' },
      { id: 27, g: '퇴휴', name: '임서윤', start: 0, sumOverride: '결3', status: '퇴원', since: '입금완료' },
      { id: 28, g: '퇴휴', name: 'U)권은서', start: 1, status: '휴원', unpaid: true }
    ].map(s => (s.time !== undefined || s.g === 'R' || s.g === '퇴휴' || s.id % 5 === 0) ? s : Object.assign({}, s, { time: ['14:00', '15:30', '16:00', '17:00', '18:30', '19:00'][s.id % 6] }));
  }
  sheetList() {
    const base = [['26\' 11월 출석부', 11], ['26\' 11월 수업진행표,업무일지', 0], ['26\' 10월 출석부', 10], ['26\' 10월 수업진행표,업무일지', 0], ['26\' 9월 출석부', 9]];
    return this.state.extra.map(m => ['26\' ' + m + '월 출석부', m]).concat(base);
  }
  monthEvents(m) {
    if (m === 11) return this.state.ev;
    if (this.state.evByMonth[m]) return this.state.evByMonth[m];
    if (m === 12) return {};
    const DOW = { '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
    const nd = new Date(2026, m, 0).getDate();
    const out = {};
    this.students().forEach(s => {
      const w = DOW[s.g];
      if (w == null) return;
      const row = {}; let k = 0;
      for (let d = 1; d <= nd; d++) {
        if (new Date(2026, m - 1, d).getDay() !== w) continue;
        k++;
        row[d] = (s.id + k + m) % 9 === 0 ? '결' : '수';
        if ((s.id + k) % 4 === 0 && d + 1 <= nd) row[d + 1] = 'V';
      }
      out[s.id] = row;
    });
    return out;
  }
  press(id, d) {
    const m = this.sheetList()[this.state.sheet][1];
    const evAll = Object.assign({}, this.monthEvents(m));
    const row = Object.assign({}, evAll[id] || {});
    const ORDER = ['', '수', '결', '보', '연', 'V'];
    const next = ORDER[(ORDER.indexOf(row[d] || '') + 1) % ORDER.length];
    if (next) row[d] = next; else delete row[d];
    evAll[id] = row;
    if (m === 11) this.setState({ ev: evAll });
    else { const bm = Object.assign({}, this.state.evByMonth); bm[m] = evAll; this.setState({ evByMonth: bm }); }
  }
  fitPrint(layout) {
    this.unfitPrint();
    const sec = document.querySelector('section[aria-label="출석부"]');
    if (!sec) return;
    const inner = sec.firstElementChild || sec;
    const w = inner.scrollWidth, h = sec.scrollHeight;
    const PW = 1065, PH = 735;
    if ((layout || this.state.printLayout) === 'split') {
      const z = Math.min(1, PW / w) * 0.98;
      sec.style.zoom = String(z);
      const head = inner.querySelector('.phead');
      const avail = (PH / z) * 0.97;
      const headH = head ? head.offsetHeight : 0;
      let used = headH;
      [...inner.children].filter(el => el.classList.contains('grp') || el.classList.contains('pnote')).forEach(g => {
        const gh = g.offsetHeight;
        if (used + gh > avail && used > headH) {
          const clone = head.cloneNode(true);
          clone.classList.add('pclone');
          clone.style.breakBefore = 'page';
          clone.style.pageBreakBefore = 'always';
          g.parentNode.insertBefore(clone, g);
          used = headH + gh;
        } else used += gh;
      });
    } else {
      const z = Math.min(1, PW / w, PH / h) * 0.98;
      sec.style.zoom = String(z);
    }
  }
  unfitPrint() {
    const sec = document.querySelector('section[aria-label="출석부"]');
    if (sec) { sec.style.zoom = ''; sec.querySelectorAll('.pclone').forEach(n => n.remove()); }
  }
  printSheet() {
    this.setState({ printOpen: true });
  }
  doPrint() {
    const bw = !!this.state.printBW, layout = this.state.printLayout || 'fit';
    this.setState({ printOpen: false });
    setTimeout(() => {
      if (bw) document.documentElement.classList.add('bwp');
      this.fitPrint(layout);
      window.print();
    }, 80);
  }
  componentDidMount() {
    this._bp = () => { if (this.state.printBW) document.documentElement.classList.add('bwp'); this.fitPrint(); };
    this._ap = () => { document.documentElement.classList.remove('bwp'); this.unfitPrint(); };
    window.addEventListener('beforeprint', this._bp);
    window.addEventListener('afterprint', this._ap);
    this._up = () => {
      this.mouseIsDown = false;
      this.dragging = false;
      if (this.pendingOpen) { this.pendingOpen = null; this.openPop('main'); }
    };
    window.addEventListener('mouseup', this._up);
  }
  componentWillUnmount() {
    window.removeEventListener('mouseup', this._up);
  }
  normSel() {
    const s = this.state.sel;
    if (!s) return null;
    return { r1: Math.min(s.r1, s.r2), r2: Math.max(s.r1, s.r2), c1: Math.min(s.c1, s.c2), c2: Math.max(s.c1, s.c2) };
  }
  selCells() {
    const n = this.normSel(), out = [];
    if (!n) return out;
    for (let r = n.r1; r <= n.r2; r++) for (let c = n.c1; c <= n.c2; c++) out.push({ r: r, d: c, sid: (this._rowSids || [])[r] });
    return out.filter(x => x.sid != null);
  }
  focusSheet() {
    const sec = document.querySelector('section[aria-label="출석부"]');
    if (sec) sec.focus({ preventScroll: true });
  }
  selDown(e, r, c) {
    if (e && e.preventDefault) e.preventDefault();
    this.focusSheet();
    this.mouseIsDown = true;
    const n = this.normSel();
    if (n && r >= n.r1 && r <= n.r2 && c >= n.c1 && c <= n.c2) {
      this.pendingOpen = { r: r, c: c };
      this.dragging = false;
      return;
    }
    this.pendingOpen = null;
    this.dragging = true;
    this.setState({ sel: { r1: r, c1: c, r2: r, c2: c }, pop: null });
  }
  selEnter(r, c) {
    if (this.pendingOpen && this.mouseIsDown) {
      const p = this.pendingOpen;
      this.pendingOpen = null;
      this.dragging = true;
      this.setState({ sel: { r1: p.r, c1: p.c, r2: r, c2: c } });
      return;
    }
    if (!this.dragging || !this.state.sel) return;
    const s = this.state.sel;
    if (s.r2 === r && s.c2 === c) return;
    this.setState({ sel: { r1: s.r1, c1: s.c1, r2: r, c2: c } });
  }
  openPop(mode) {
    const s = this.state.sel;
    if (!s) return;
    const W = 360, H = mode === 'del' ? (this.delBoth ? 470 : 330) : 470;

    const calc = s => {
      const k = keyOf(s);

      const sibs = all.filter(x => keyOf(x) === k);
      const s0 = sibs[0];
      const T = s0.tickets || (s0.nameBg ? 8 : 4);
      let used = s0.start, carry = s0.start, since = (s0.since && s0.since !== '입금완료') ? s0.since : '', pending = !!s0.unpaid;
      const outs = {};
      sibs.forEach(x => { outs[x.id] = []; });
      const prevSeq = [];
      for (let pd = 1; pd <= 31; pd++) sibs.forEach(x => { const pv = PREV ? (PREV[x.id] || {})[pd] : null; if (pv === '수' || pv === '결') prevSeq.push(pv); });
      let marks = [];

          used++;
          marks[used - 1] = v;
          lessonCount++; if (s0.rowBg) lessonPro++; else lessonHobby++;
          if (v === '수') {
            text = String(used) + (used === T ? '!' : ''); what = used + '회차 출석';
          } else { text = '결' + used; what = used + '회차 결석'; }
          kind = v;
        } else if (v === 'M') {
          const mt0 = st.mkTimes[MON + '-' + d + '-' + x.id] || '';

        } else if (v === '보') { text = '보'; what = '보강 예정'; kind = '보'; }

          since = MON + '/' + d;
        }
        outs[x.id].push({ d: d, text: text, what: what, kind: kind, pay: pay && !!v, mstat: mstat });
      });
      const needPay = pending || used >= T;
      calcCache[k] = {};
      sibs.forEach(x => { calcCache[k][x.id] = { cells: outs[x.id], T: T, used: used, carry: Math.min(carry, used), since: since, needPay: needPay, marks: marks }; });

    };

    const all = this.students();
    const GROUPS = [['월', '월'], ['화', '화'], ['수', '수'], ['목', '목'], ['금', '금'], ['토', '토'], ['R', 'R'], ['퇴휴', '퇴\n&\n휴']];

        const dots = [], dotGroups = [];
        for (let i = 1; i <= r.T; i++) dots.push({ style: 'width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; ' +
          (i <= r.used ? 'background: ' + (r.marks[i - 1] === '결' ? '#E0605A' : '#00A6AB') : 'border: 1.5px solid #CDD4D0') });

    this._rows = rowIdx;
    const P = st.pop;
    const popCells = P ? this.selCells() : [];
    const sidName = {};
    all.forEach(s0 => { sidName[s0.id] = s0.name.replace('$', ''); });
    const first = popCells[0];

    const LT = ['14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
    const WD = ['일', '월', '화', '수', '목', '금', '토'];
    const curRow = popCells.length === 1 ? (this.monthEvents(MON)[first.sid] || {}) : {};
    const curV = popCells.length === 1 ? (curRow[first.d] === 'V' ? '' : (curRow[first.d] || '')) : '';
    const curPay = popCells.length === 1 && !!(curRow['p' + first.d] || curRow[first.d] === 'V');
    const big = st0 => st0.replace('width: 20px; height: 20px', 'width: 26px; height: 26px').replace('min-width: 24px; height: 24px', 'min-width: 28px; height: 28px').replace('font-size: 11px', 'font-size: 13px');
    const keycap = (fg, bd) => 'position: absolute; top: 9px; right: 9px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 6px; border: 1px solid ' + bd + '; border-bottom-width: 2px; background: #FFFFFF; color: ' + fg + '; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center';
    const popBtns = [

      ['결', '결석', '결', MARK['결'], '2', '#FEF1EC', '#C2410C', '#F8D7C9', '#F0C2AE'],
      ['보', '보강', '보', MARK['보'], '3', '#EEF3FD', '#1E4FA8', '#D3DFF7', '#BCCDF0'],
      ['연', '연기', '연', MARK['연'], '4', '#F4F6F5', '#3A4450', '#DDE2DF', '#CDD3D0']
    ].map(b => {

        label: b[1], mark: b[2], chip: big(b[3]), key: b[4],
        style: '--sh: ' + b[8] + '; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 110px; border-radius: 18px; border: ' + (on ? '2px solid ' + b[6] : '1px solid ' + b[7]) + '; background: linear-gradient(180deg, #FFFFFF 0%, ' + b[5] + ' 55%); color: ' + b[6] + '; cursor: pointer; font-family: inherit; padding: 0; margin-bottom: 4px',

      delBoth: !!P && P.mode === 'del' && !!this.delBoth,
      delOne: !!P && P.mode === 'del' && !this.delBoth,
      delAtt: () => this.clearPart('att'),
      delAttLabel: this.delAttLabel || '출결만 지우기',

      confirmDel: () => this.applyMark(''),
      title: !first ? '' : popCells.length === 1 ? sidName[first.sid] : popCells.length + '칸 선택',
      monLabel: MON + '월',
      dayLabel: first ? String(first.d) : '',
      cls: popCells.length === 1 && firstStu ? (firstStu.rowBg ? '전문반' : '취미반') : '',
      sub: !first ? '' : popCells.length === 1 ? (lt12 ? '수업 시간 ' + lt12 : '') : '같은 표시가 한 번에 들어갑니다',

      payStyle: '--sh: #E0CB8F; position: relative; display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 18px; border: ' + (curPay ? '2px solid #7A5C12' : '1px solid #EAD9A6') + '; background: linear-gradient(180deg, #FFFFFF 0%, #F7EED3 55%); color: #7A5C12; font-family: inherit; cursor: pointer; margin-bottom: 4px',
      payCur: curPay ? 'position: absolute; top: 19px; left: 14px; font-size: 10px; font-weight: 700; color: #FFFFFF; background: #7A5C12; padding: 2px 6px; border-radius: 6px' : 'display: none',
      payKey: keycap('#7A5C12', '#EAD9A6').replace('top: 9px', 'top: 19px').replace('right: 9px', 'right: 14px'),

      saveLabel: '보강 등록',
      key: e => {
