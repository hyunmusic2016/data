<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수납 안내</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="db.js?v=0.69.0"></script>
<style>.expitem:hover{background:#F2F5F3!important}
body{margin:0;background:#F3F5F4}
a{color:#007E82}a:hover{color:#005F62}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #00A6AB;outline-offset:1px}
@page{size:A4 landscape;margin:8mm}
.printonly{display:none}
html.bwp .printonly *{color:#000!important;background-color:transparent!important}
html.bwp .printonly .pcell{border-color:#000!important}
@media print{.noprint{display:none!important}.printonly{display:block!important}html,body{background:#FFFFFF!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.menurow:last-child{border-bottom:none!important}.menurow:hover{background-color:#F7FAFA!important}
.menurow button[disabled]{cursor:default!important}
.hubitem:hover{background:#F7FAFA!important}
@keyframes rowflash2{0%,55%{background-color:#E6F6F6}100%{background-color:#FFFFFF}}
.shell{height:100vh!important;min-height:0!important}.shellmain{flex:1 1 auto!important;min-height:0!important;overflow:hidden!important;padding-bottom:14px!important}.shell>header,.shell>nav,.shell>div:not(.shellmain){flex:none!important}.shellmain>*:not(.shellsec){flex:none}.shellsec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.shellscroll{flex:1 1 auto;min-height:0;overflow:auto!important}
@media print{.shell{height:auto!important}.shellmain{overflow:visible!important}.shellsec{display:block!important}.shellscroll{overflow:visible!important}}
.nrow:hover>*{box-shadow:inset 0 1px 0 #AEB7B2,inset 0 -1px 0 #AEB7B2}
.memoInp:hover{border-color:#CDD4D0!important;background:#FFFFFF!important}.memoInp:focus{border-color:#00A6AB!important;background:#FFFFFF!important;outline:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<sc-if value="{{noAccess}}" hint-placeholder-val="{{ false }}"><div class="noprint" style="position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F3F5F4; font-family: 'Paperlogy', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><span style="font-size: 18px; font-weight: 600; color: #17201C">수납 안내는 원장님만 볼 수 있습니다.</span><a href="attendance.html" style="height: 44px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 12px; background: #00A6AB; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">출석부로 가기</a></div></sc-if>
<div class="noprint shell" style="display: flex; flex-direction: column; min-height: 100vh; font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C; background: #F3F5F4; font-variant-numeric: tabular-nums">

  <header style="background: #FFFFFF; border-bottom: 1px solid #C6CDC7; padding: 8px 24px 0; display: flex; flex-direction: column">
    <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="{{t.style}}">{{t.label}}<span style="font-size: 11px; color: #66716A; margin-left: 4px">{{t.cnt}}</span></a>
      </sc-for>
    </nav>
  </header>

  <main class="shellmain" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 28px 40px; box-sizing: border-box">

    <section aria-label="수납 안내" class="shellsec" style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.05)">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #EBEEEC">
        <span style="display: inline-flex; align-items: center; gap: 14px">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #00A6AB; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 166, 171, 0.32)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8M8 13h5"></path></svg></span>
          <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; padding: 0 2px; background-image: linear-gradient(transparent 62%, #BFEAEB 62%, #BFEAEB 92%, transparent 92%)">현실용음악학원 수납 안내</span>
        </span>
        <span style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; background: #E6F6F6; color: #007E82; font-size: 14px; font-weight: 600">{{count}}명</span>
        <span style="flex: 1"></span>
        <span class="noexp" style="display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <span style="font-size: 13px; font-weight: 600; color: #5E6873">{{selTxt}}</span>
          <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #5E6873">발송 날짜<input id="nt_date" type="date" defaultValue="{{sendDate}}" onChange="{{setDate}}" style="height: 38px; padding: 0 10px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D5DBD8; background: #FAFBFA; font-family: inherit; font-size: 14px; color: #17201C"></label>
          <button type="button" onClick="{{bulk}}" disabled="{{bulkOff}}" style="{{bulkStyle}}">선택한 원생 발송 체크</button>
        </span>
      </div>

      <div id="nt_scroll" class="shellscroll" style="padding: 0 0 8px">
        <div role="table" aria-label="수납 안내 목록" style="min-width: 820px">
          <div role="row" style="{{gridHead}}">
            <span role="columnheader" class="noexp" style="{{c.h}}"><input type="checkbox" aria-label="전체 선택" checked="{{allOn}}" onChange="{{toggleAll}}" style="width: 16px; height: 16px; accent-color: #00A6AB; cursor: pointer"></span>
            <span role="columnheader" style="{{c.h}}">요일</span>
            <span role="columnheader" style="{{c.h}}">이름</span>
            <span role="columnheader" style="{{c.hl}}">발송</span>
            <span role="columnheader" style="{{c.h}}">횟수</span>
            <span role="columnheader" style="{{c.h}}">강사</span>
            <span role="columnheader" style="{{c.hl}}">수강</span>
            <span role="columnheader" style="{{c.hl}}">MEMO</span>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div role="row" class="nrow" style="{{r.rowStyle}}">
              <span role="cell" class="noexp" onMouseDown="{{r.dragDown}}" onMouseEnter="{{r.dragOver}}" style="{{c.cc}}; cursor: pointer; user-select: none"><input type="checkbox" tabindex="-1" aria-label="{{r.selLabel}}" checked="{{r.on}}" style="width: 16px; height: 16px; accent-color: #00A6AB; pointer-events: none"></span>
              <span role="cell" style="{{c.cc}}"><sc-for list="{{r.days}}" as="dy" hint-placeholder-count="1"><span style="{{dy.style}}">{{dy.t}}</span></sc-for></span>
              <span role="cell" style="{{c.cc}}; font-weight: 600">{{r.name}}</span>
              <span role="cell" style="{{c.cl}}; flex-wrap: wrap; gap: 4px"><sc-for list="{{r.sends}}" as="sd" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 2px 0 7px; border-radius: 999px; background: #E6F6F6; color: #007E82; font-size: 12px; font-weight: 600; white-space: nowrap">{{sd.t}}<button type="button" class="noexp" onClick="{{sd.del}}" aria-label="{{sd.delLabel}}" title="발송 기록 지우기" style="width: 18px; height: 18px; padding: 0; border: none; border-radius: 999px; background: transparent; color: #5E9C9E; font-family: inherit; font-size: 13px; line-height: 1; cursor: pointer">×</button></span></sc-for><sc-if value="{{r.noSend}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #B7C0BC">-</span></sc-if></span>
              <span role="cell" style="{{c.cc}}"><span style="{{r.cntStyle}}">{{r.cnt}}</span></span>
              <span role="cell" style="{{c.cc}}"><span style="{{r.tStyle}}">{{r.teacher}}</span></span>
              <span role="cell" style="{{c.cl}}"><span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 3px 0"><span style="display: flex; align-items: flex-end; gap: 5px"><span style="display: flex; flex-direction: column; gap: 3px"><sc-for list="{{r.tk.dotLines}}" as="dl" hint-placeholder-count="1"><span style="display: flex; align-items: center; gap: 5px"><sc-for list="{{dl.groups}}" as="dg" hint-placeholder-count="2"><span style="display: flex; gap: 2px"><sc-for list="{{dg.dots}}" as="dd" hint-placeholder-count="4"><span style="{{dd.style}}"></span></sc-for></span></sc-for></span></sc-for></span><sc-if value="{{r.tk.queueTxt}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 15px; padding: 0 5px; border-radius: 5px; background: #F3E6C4; color: #7A5C12; font-size: 9px; font-weight: 600; white-space: nowrap">{{r.tk.queueTxt}}</span></sc-if></span><span style="font-size: 11px; letter-spacing: -0.02em; white-space: normal; line-height: 1.25; text-align: left"><sc-for list="{{r.tk.subParts}}" as="sp" hint-placeholder-count="1"><span style="{{sp.style}}">{{sp.t}}</span></sc-for></span></span></span>
              <span role="cell" style="{{c.cl}}"><input id="{{r.memoId}}" type="text" defaultValue="{{r.memo}}" onChange="{{r.saveMemo}}" aria-label="{{r.memoLabel}}" style="width: 100%; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; border: 1px solid transparent; background: transparent; font-family: inherit; font-size: 13px; color: #17201C" class="memoInp"></span>
            </div>
          </sc-for>
          <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 48px 22px; text-align: center; font-size: 15px; font-weight: 600; color: #8A949E">수납 안내할 원생이 없습니다.</div>
          </sc-if>
        </div>
      </div>
      <div class="noexp" style="padding: 10px 22px 14px; border-top: 1px solid #EBEEEC; font-size: 12px; color: #8A949E">출석부에서 마지막 회차를 출석하면 이 목록에 올라오고, 수납하면 빠집니다. 수강 상태는 출석부를 연 브라우저에서 계산한 그대로입니다.</div>
    </section>

    <div class="noprint" style="display: flex; justify-content: flex-end; align-items: center; gap: 8px">
      <button type="button" onClick="{{printX}}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #17201C; font-size: 13px; font-weight: 600; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"></path></svg>
        인쇄
      </button>
      <span style="position: relative; display: inline-flex">
      <button type="button" onClick="{{exp.toggle}}" aria-haspopup="menu" aria-expanded="{{exp.openStr}}" style="{{exp.btnStyle}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
        {{exp.label}}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <sc-if value="{{exp.open}}" hint-placeholder-val="{{ false }}">
        <div onMouseDown="{{exp.close}}" style="position: fixed; inset: 0; z-index: 60"></div>
        <div role="menu" aria-label="내보내기" style="position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 61; width: 200px; box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; box-shadow: 0 12px 32px rgba(23, 32, 28, 0.16)">
          <button type="button" role="menuitem" onClick="{{exp.img}}" class="expitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: transparent; color: #17201C; font-family: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer">이미지로 내보내기</button>
          <button type="button" role="menuitem" onClick="{{exp.pdf}}" class="expitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: transparent; color: #17201C; font-family: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer">PDF로 내보내기</button>
          <button type="button" role="menuitem" onClick="{{exp.xls}}" class="expitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: transparent; color: #17201C; font-family: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer">엑셀로 내보내기</button>
        </div>
      </sc-if>
      </span>
      <span style="font-size: 11px; color: #8A949E; padding-left: 6px">v0.69.1</span>
    </div>
  </main>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; padding: 12px 18px; border-radius: 12px; background: #17201C; color: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px rgba(23, 32, 28, 0.25)">{{toast}}</div>
  </sc-if>
  <sc-if value="{{pr.open}}" hint-placeholder-val="{{ false }}">
    <div class="noprint" onMouseDown="{{pr.close}}" style="position: fixed; inset: 0; z-index: 44; background: rgba(23, 32, 28, 0.28)"></div>
    <div class="noprint" role="dialog" aria-label="인쇄 설정" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45; width: 360px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 22px; box-shadow: 0 24px 60px rgba(23, 32, 28, 0.22)">
      <span style="font-size: 18px; font-weight: 600">인쇄</span>
      <span style="font-size: 13px; color: #5E6873">A4 가로</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{pr.opts}}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{pr.close}}" style="flex: 1; height: 46px; border-radius: 13px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #3A4450; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
        <button type="button" onClick="{{pr.go}}" style="flex: 2; height: 46px; border-radius: 13px; border: none; background: #00A6AB; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">인쇄하기</button>
      </div>
    </div>
  </sc-if>
</div>
<div class="printonly" style="font-family: 'Paperlogy', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C">
  <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px">현실용음악학원 수납 안내</div>
  <div style="font-size: 11px; color: #5E6873; margin-bottom: 10px">{{printDate}}</div>
  <table style="border-collapse: collapse; width: 100%; font-size: 12px">
    <thead><tr><sc-for list="{{printHead}}" as="h" hint-placeholder-count="4"><th class="pcell" style="font-weight: 600; border: 1px solid #C9D0CC; padding: 6px; background: #EEF2EE">{{h}}</th></sc-for></tr></thead>
    <tbody><sc-for list="{{printRows}}" as="pr0" hint-placeholder-count="6"><tr><sc-for list="{{pr0}}" as="v" hint-placeholder-count="4"><td class="pcell" style="border: 1px solid #C9D0CC; padding: 6px; text-align: center">{{v}}</td></sc-for></tr></sc-for></tbody>
  </table>
</div>
</template>
<script>
class DCLogic{constructor(props){this.props=props||{};this.state={}}
  setState(p){this.state=Object.assign({},this.state,p);render()}}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, sel: {}, sendDate: '', toast: '', printOpen: false, bw: true, expOpen: false };
  }
  installPopupDrag() {
    if (window.__popDrag) return; window.__popDrag = 1;
    const off = {}; let drag = null;
    const st = document.createElement('style');
    st.textContent = '[role="dialog"],[role="alertdialog"]{cursor:move}[role="dialog"] input,[role="dialog"] textarea,[role="dialog"] select,[role="alertdialog"] input,[role="alertdialog"] textarea,[role="alertdialog"] select{cursor:auto}[role="dialog"] button,[role="alertdialog"] button,[role="dialog"] label,[role="alertdialog"] label{cursor:pointer}';
    document.head.appendChild(st);
    const SEL = '[role="dialog"],[role="alertdialog"]';
    const keyOf = el => el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || 'popup';
    const find = k => [].slice.call(document.querySelectorAll(SEL)).filter(el => keyOf(el) === k)[0];
    const put = (el, o) => { const v = o ? o[0] + 'px ' + o[1] + 'px' : ''; if (el.style.translate !== v) el.style.translate = v; };
    const sync = () => {
      const seen = {};
      [].slice.call(document.querySelectorAll(SEL)).forEach(el => { const k = keyOf(el); seen[k] = 1; put(el, off[k]); });
      Object.keys(off).forEach(k => { if (!seen[k] && !(drag && drag.k === k)) delete off[k]; });
    };
    new MutationObserver(sync).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
    document.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      const el = e.target.closest && e.target.closest(SEL); if (!el) return;
      if (e.target.closest('input,textarea,select,button,a,label,option,[contenteditable="true"],[role="checkbox"],[role="radio"],[role="switch"],[role="tab"],[role="menuitem"],[draggable="true"]')) return;
      const k = keyOf(el), o = off[k] || [0, 0];
      drag = { k: k, x: e.clientX, y: e.clientY, ox: o[0], oy: o[1] };
      e.preventDefault();
    }, true);
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      const el = find(drag.k); if (!el) return;
      let nx = drag.ox + e.clientX - drag.x, ny = drag.oy + e.clientY - drag.y;
      off[drag.k] = [nx, ny]; put(el, off[drag.k]);
      // 화면 밖으로 다 나가지 않게: 위쪽은 화면 안, 좌우·아래는 80px 이상 보이게
      const r = el.getBoundingClientRect();
      if (r.top < 0) ny -= r.top;
      if (r.top > window.innerHeight - 60) ny -= r.top - (window.innerHeight - 60);
      if (r.left > window.innerWidth - 80) nx -= r.left - (window.innerWidth - 80);
      if (r.right < 80) nx += 80 - r.right;
      off[drag.k] = [nx, ny]; put(el, off[drag.k]);
    });
    document.addEventListener('mouseup', () => { drag = null; });
  }
  installTextInputs() {
    if (window.__txIn) return; window.__txIn = 1;
    const OK = { text: 1, search: 1, tel: 1, email: 1, url: 1 };
    const isTx = el => !!el && el.tagName === 'INPUT' && !el.readOnly && !el.disabled && !!OK[(el.getAttribute('type') || 'text').toLowerCase()] && !el.hasAttribute('data-noclear');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'noprint noexp'; btn.setAttribute('aria-label', '입력 지우기'); btn.textContent = '×';
    btn.style.cssText = 'position: fixed; z-index: 100000; display: none; width: 20px; height: 20px; padding: 0; border: none; border-radius: 50%; background: #DDE2DF; color: #5E6873; font-family: inherit; font-size: 14px; line-height: 20px; text-align: center; cursor: pointer';
    document.body.appendChild(btn);
    const sty = document.createElement('style');
    sty.textContent = 'input[data-xon] { padding-right: 32px !important; box-sizing: border-box !important }';
    document.head.appendChild(sty);
    let cur = null, hov = null, down = null, raf = 0, pos = '';
    const hide = () => { if (btn.style.display !== 'none') btn.style.display = 'none'; if (cur) { cur.removeAttribute('data-xon'); cur = null; } };
    const tick = () => {
      raf = 0;
      const el = isTx(document.activeElement) ? document.activeElement : (hov && document.body.contains(hov) && isTx(hov) ? hov : null);
      const r = el ? el.getBoundingClientRect() : null;
      if (!el || !el.value || r.width < 110 || r.height < 14) { hide(); return; }
      if (cur && cur !== el) cur.removeAttribute('data-xon');
      cur = el;
      if (el.getAttribute('data-xon') !== '1') el.setAttribute('data-xon', '1');
      const p = Math.round(r.right - 26) + ',' + Math.round(r.top + (r.height - 20) / 2);
      if (p !== pos) { pos = p; const q = p.split(','); btn.style.left = q[0] + 'px'; btn.style.top = q[1] + 'px'; }
      if (btn.style.display !== 'block') btn.style.display = 'block';
      raf = requestAnimationFrame(tick);
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    document.addEventListener('focusin', kick);
    document.addEventListener('input', kick);
    document.addEventListener('mouseover', e => { if (isTx(e.target)) { hov = e.target; kick(); } });
    document.addEventListener('mouseout', e => { if (hov && e.target === hov && e.relatedTarget !== btn) { hov = null; kick(); } });

function look(scope,path){path=path.trim();if(path==='true')return true;if(path==='false')return false;

function build(node,scope,out){

  if(node.nodeType!==1)return;

    if(a.name==='checked'){const cv=interp(a.value,scope);if(cv===true||cv==='true')el.setAttribute('checked','');continue;}
    if(a.name==='disabled'){const dv=interp(a.value,scope);if(dv===true||dv==='true')el.setAttribute('disabled','');continue;}
