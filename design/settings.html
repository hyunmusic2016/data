<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="db.js?v=0.51.1"></script>
<style>.expitem:hover{background:#F2F5F3!important}
body{margin:0;background:#F3F5F4}
a{color:#007E82}a:hover{color:#005F62}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #00A6AB;outline-offset:1px}
@page{size:A4 landscape;margin:8mm}
.printonly{display:none}
html.bwp .printonly *{color:#000!important;background-color:transparent!important}
html.bwp .printonly .pcell{border-color:#000!important}
@media print{.noprint{display:none!important}.printonly{display:block!important}html,body{background:#FFFFFF!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.menurow:last-child{border-bottom:none!important}.menurow:hover{background-color:#F7FAFA!important}
.menurow button[disabled]{cursor:default!important}
.hubitem:hover{background:#F7FAFA!important}
@keyframes rowflash2{0%,55%{background-color:#E6F6F6}100%{background-color:#FFFFFF}}
.shell{height:100vh!important;min-height:0!important}.shellmain{flex:1 1 auto!important;min-height:0!important;overflow:hidden!important;padding-bottom:14px!important}.shell>header,.shell>nav,.shell>div:not(.shellmain){flex:none!important}.shellmain>*:not(.shellsec){flex:none}.shellsec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.shellscroll{flex:1 1 auto;min-height:0;overflow:auto!important}
@media print{.shell{height:auto!important}.shellmain{overflow:visible!important}.shellsec{display:block!important}.shellscroll{overflow:visible!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="noprint shell" style="display: flex; flex-direction: column; min-height: 100vh; font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C; background: #F3F5F4; font-variant-numeric: tabular-nums">

  <header style="background: #FFFFFF; border-bottom: 1px solid #C6CDC7; padding: 8px 24px 0; display: flex; flex-direction: column">
    <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="{{t.style}}">{{t.label}}<span style="font-size: 11px; color: #66716A; margin-left: 4px">{{t.cnt}}</span></a>
      </sc-for>
    </nav>
  </header>

  <main class="shellmain" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 28px 40px; box-sizing: border-box">

    <section aria-label="설정" class="shellsec" style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.05)">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #EBEEEC">
        <span style="display: inline-flex; align-items: center; gap: 14px">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #00A6AB; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 166, 171, 0.32)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span>
          <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; padding: 0 2px; background-image: linear-gradient(transparent 62%, #BFEAEB 62%, #BFEAEB 92%, transparent 92%)">현실용음악학원 설정</span>
        </span>
      </div>

      <div class="shellscroll" style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <sc-if value="{{viewHub}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; max-width: 1100px">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; padding: 16px 18px 6px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E6E3; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.04)">
                <span style="padding-bottom: 10px; border-bottom: 2px solid #00A6AB; font-size: 14px; font-weight: 600; color: #3A4450">{{g.title}}</span>
                <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
                  <button type="button" class="hubitem" onClick="{{it.open}}" style="{{it.style}}"><span>{{it.label}}</span><span style="flex: 1"></span><sc-if value="{{it.soon}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: #EEF1F0; color: #8A949E; font-size: 11px; font-weight: 600">준비 중</span></sc-if><span aria-hidden="true" style="color: #B7C0BC; font-size: 16px">›</span></button>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{viewSub}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px">
            <button type="button" class="noexp" onClick="{{goHub}}" style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #3A4450; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">‹ 설정</button>
            <span style="font-size: 13px; color: #8A949E">{{subGroup}}</span>
            <span style="font-size: 13px; color: #B7C0BC">›</span>
            <span style="font-size: 15px; font-weight: 600; color: #17201C">{{subTitle}}</span>
          </div>
        </sc-if>
        <sc-if value="{{viewSoon}}" hint-placeholder-val="{{ false }}">
          <div style="max-width: 760px; padding: 40px 22px; border-radius: 18px; background: #FAFBFA; border: 1px dashed #CDD4D0; text-align: center; font-size: 15px; font-weight: 600; color: #8A949E">{{subTitle}} 기능은 준비 중입니다.</div>
        </sc-if>
        <sc-if value="{{viewSubj}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 14px; max-width: 820px; padding: 20px 22px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8E5">
            <sc-if value="{{readOnly}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 12px; border-radius: 10px; background: #FFF4E0; color: #9A5B00; font-size: 13px; font-weight: 600">수강과목은 원장님만 바꿀 수 있습니다.</div></sc-if>
            <div style="display: flex; flex-direction: column; border: 1px solid #E3E8E5; border-radius: 12px; overflow: hidden">
              <sc-for list="{{subjRows}}" as="m" hint-placeholder-count="6">
                <div class="menurow" data-id="{{m.id}}" draggable="{{m.drag}}" onDragStart="{{m.dragStart}}" onDragOver="{{m.dragOver}}" onDragLeave="{{m.dragLeave}}" onDrop="{{m.drop}}" onDragEnd="{{m.dragEnd}}" style="{{m.rowStyle}}">
                  <span class="noexp" style="{{m.gripStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
                  <span style="width: 22px; flex: none; font-size: 13px; font-weight: 600; color: #8A949E; text-align: center">{{m.no}}</span>
                  <span style="{{m.chip}}">{{m.name}}</span>
                  <input id="{{m.inputId}}" type="text" defaultValue="{{m.name}}" disabled="{{m.lock}}" onBlur="{{m.saveName}}" onKeyDown="{{m.nameKey}}" aria-label="과목 이름" style="width: 150px; height: 34px; padding: 0 10px; box-sizing: border-box; border-radius: 9px; border: 1px solid #E1E6E3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #17201C">
                  <span class="noexp" style="display: inline-flex; gap: 4px; flex-wrap: wrap">
                    <sc-for list="{{m.colors}}" as="cl" hint-placeholder-count="10"><button type="button" onClick="{{cl.pick}}" disabled="{{m.lock}}" aria-label="색 고르기" style="{{cl.style}}"></button></sc-for>
                  </span>
                  <span style="flex: 1"></span>
                  <span style="font-size: 12px; color: #8A949E; white-space: nowrap">{{m.usedTxt}}</span>
                  <button type="button" class="noexp" onClick="{{m.up}}" disabled="{{m.lockUp}}" aria-label="위로" style="{{m.arrowStyle}}">▲</button>
                  <button type="button" class="noexp" onClick="{{m.down}}" disabled="{{m.lockDown}}" aria-label="아래로" style="{{m.arrowStyle}}">▼</button>
                  <button type="button" class="noexp" onClick="{{m.del}}" disabled="{{m.lock}}" style="{{m.delStyle}}">{{m.delLabel}}</button>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}">
              <div class="noexp" style="display: flex; align-items: center; gap: 8px">
                <input id="newSubj" type="text" defaultValue="" onKeyDown="{{subjKey}}" aria-label="새 수강과목 이름" style="flex: 1; max-width: 240px; height: 40px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D5DBD8; background: #FAFBFA; font-family: inherit; font-size: 14px; color: #17201C">
                <button type="button" onClick="{{addSubj}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: none; background: #00A6AB; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">+ 수강과목 추가</button>
                <span style="font-size: 13px; font-weight: 600; color: #B4332B">{{err}}</span>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{viewStaff}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8E5">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
              <span style="font-size: 15px; font-weight: 600">직원 {{staffCount}}명</span>
              <span style="font-size: 12px; color: #8A949E">{{staffNote}} {{staffHidNote}}</span>
              <span style="flex: 1"></span>
              <div class="noexp" style="position: relative">
                <button type="button" onClick="{{sf.toggle}}" aria-haspopup="dialog" style="{{sf.btnStyle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg>필터<sc-if value="{{sf.n}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #00A6AB; color: #FFFFFF; font-size: 11px; font-weight: 600">{{sf.n}}</span></sc-if></button>
                <sc-if value="{{sf.open}}" hint-placeholder-val="{{ false }}">
                  <div onMouseDown="{{sf.close}}" style="position: fixed; inset: 0; z-index: 30"></div>
                  <div role="dialog" aria-label="필터" style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 31; width: 520px; max-width: calc(100vw - 48px); box-sizing: border-box; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 18px; box-shadow: 0 18px 48px rgba(23, 32, 28, 0.18)">
                    <div style="display: flex; align-items: center; gap: 8px">
                      <span style="font-size: 15px; font-weight: 600">필터</span>
                      <span style="flex: 1"></span>
                      <button type="button" onClick="{{sf.reset}}" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">초기화</button>
                      <button type="button" onClick="{{sf.close}}" aria-label="닫기" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; cursor: pointer">×</button>
                    </div>
                    <sc-if value="{{sf.none}}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #8A949E"><span>아직 고른 필터 항목이 없습니다.</span><button type="button" onClick="{{sf.pick}}" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #A9DCDE; background: #E6F6F6; color: #007E82; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">필터 항목 고르기</button></div>
                    </sc-if>
                    <sc-for list="{{sf.groups}}" as="g" hint-placeholder-count="2">
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <span style="font-size: 12px; font-weight: 600; color: #5E6873">{{g.title}}</span>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
              <span class="noexp" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #DDE2DF; background: #FFFFFF; width: 240px; box-sizing: border-box">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A949E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input id="sq" type="text" defaultValue="{{sq.val}}" onInput="{{sq.input}}" onBlur="{{sq.blur}}" onKeyDown="{{sq.key}}" aria-label="이름, 전화번호, 주소, 담당업무로 찾기" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: #17201C">
              </span>
              <sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}"><button type="button" class="noexp" onClick="{{empNew}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: none; background: #00A6AB; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">+ 직원 등록</button></sc-if>
              <button type="button" class="noexp" onClick="{{scfg.open}}" aria-label="표시할 항목 설정" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
            </div>
            <div style="overflow-x: auto; border: 1px solid #E3E8E5; border-radius: 12px">
              <div style="{{empGrid}}; background: #F7F9F8; border-bottom: 1px solid #E1E6E3">
                <sc-for list="{{empHeads}}" as="h" hint-placeholder-count="10"><span class="{{h.cls}}" style="{{h.style}}">{{h.label}}</span></sc-for>
              </div>
              <sc-for list="{{empRows}}" as="r" hint-placeholder-count="5">
                <div class="{{r.cls}}" data-s="{{r.sKey}}" style="{{empGrid}}; border-bottom: 1px solid #EBEEEC; background: {{r.bg}}">
                  <sc-for list="{{r.cells}}" as="x" hint-placeholder-count="9">
                    <span style="{{x.cell}}"><sc-if value="{{x.isText}}" hint-placeholder-val="{{ true }}">{{x.text}}</sc-if><sc-if value="{{x.isChip}}" hint-placeholder-val="{{ false }}"><span style="{{x.chip}}">{{x.text}}</span></sc-if><sc-if value="{{x.isChips}}" hint-placeholder-val="{{ false }}"><sc-for list="{{x.chips}}" as="sj" hint-placeholder-count="2"><span style="{{sj.style}}">{{sj.name}}</span></sc-for></sc-if></span>
                  </sc-for>
                  <span class="noexp" style="{{c.cc}}; gap: 6px">
                    <sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{r.edit}}" style="{{c.btn}}">수정</button><button type="button" onClick="{{r.leaveAct}}" style="{{r.leaveBtnStyle}}">{{r.leaveLabel}}</button></sc-if>
                  </span>
                </div>
              </sc-for>
              <sc-if value="{{staffEmpty}}" hint-placeholder-val="{{ false }}"><div style="padding: 26px; text-align: center; font-size: 14px; color: #8A949E">{{staffEmptyTxt}}</div></sc-if>
              <div id="sqEmpty" style="display: none; padding: 26px; text-align: center; font-size: 14px; color: #8A949E">찾는 직원이 없습니다.</div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{scfg.isOpen}}" hint-placeholder-val="{{ false }}">
          <div class="noprint" onMouseDown="{{scfg.close}}" style="position: fixed; inset: 0; z-index: 44; background: rgba(23, 32, 28, 0.28)"></div>
          <div class="noprint" role="dialog" aria-label="직원명부 설정" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45; width: 640px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow: auto; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 22px; box-shadow: 0 24px 60px rgba(23, 32, 28, 0.22)">
            <div style="display: flex; align-items: center; gap: 8px">
              <sc-for list="{{scfg.tabs}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
              <span style="flex: 1"></span>
              <sc-if value="{{scfg.showReset}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{scfg.reset}}" style="height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">기본값으로</button></sc-if>
              <button type="button" onClick="{{scfg.close}}" aria-label="닫기" style="width: 32px; height: 32px; border-radius: 9px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; cursor: pointer">×</button>
            </div>
            <div style="{{scfg.gridStyle}}">
              <sc-if value="{{scfg.showAll}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #FAFBFA; border: 1px solid #E3E8E5">
                <sc-if value="{{scfg.allTitle}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; color: #5E6873; margin-bottom: 4px">{{scfg.allTitle}}</span></sc-if>
                <sc-for list="{{scfg.all}}" as="o" hint-placeholder-count="8"><button type="button" role="checkbox" aria-checked="{{o.on}}" onClick="{{o.toggle}}" disabled="{{o.fixed}}" style="{{o.style}}"><span style="{{o.box}}">✓</span>{{o.label}}</button></sc-for>
              </div></sc-if>
              <sc-if value="{{scfg.showOrder}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E8E5">
                <span style="font-size: 12px; font-weight: 600; color: #5E6873; margin-bottom: 4px">{{scfg.orderTitle}}</span>

        <sc-for list="{{pr.opts}}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{pr.close}}" style="flex: 1; height: 46px; border-radius: 13px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #3A4450; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
        <button type="button" onClick="{{pr.go}}" style="flex: 2; height: 46px; border-radius: 13px; border: none; background: #00A6AB; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">인쇄하기</button>
      </div>
    </div>

</div>
<div class="printonly" style="font-family: 'Paperlogy', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C">
  <div style="font-size: 20px; font-weight: 800; margin-bottom: 4px">{{printTitle}}</div>
  <div style="font-size: 11px; color: #5E6873; margin-bottom: 10px">{{printDate}}</div>
  <table style="border-collapse: collapse; width: 100%; font-size: 12px">
    <thead><tr><sc-for list="{{printHead}}" as="h" hint-placeholder-count="4"><th class="pcell" style="font-weight: 600; border: 1px solid #C9D0CC; padding: 6px; background: #EEF2EE">{{h}}</th></sc-for></tr></thead>
    <tbody><sc-for list="{{printRows}}" as="pr0" hint-placeholder-count="6"><tr><sc-for list="{{pr0}}" as="v" hint-placeholder-count="4"><td class="pcell" style="border: 1px solid #C9D0CC; padding: 6px; text-align: center">{{v}}</td></sc-for></tr></sc-for></tbody>
  </table>
</div>
</template>
<script>
class DCLogic{constructor(props){this.props=props||{};this.state={}}
  setState(p){this.state=Object.assign({},this.state,p);render()}}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, err: '', resetAsk: false, printOpen: false, bw: true, expOpen: false, view: this.viewOfHash() };
  }
  // 모든 팝업(role=dialog/alertdialog)을 마우스로 끌어 옮기기. 입력칸·버튼 위에서는 끌지 않음.
  // 화면을 다시 그려도 옮긴 자리를 유지하고(aria-label별), 팝업이 닫히면 다음에 다시 가운데서 열림.
  installPopupDrag() {
    if (window.__popDrag) return; window.__popDrag = 1;
    const off = {}; let drag = null;
    const st = document.createElement('style');
    st.textContent = '[role="dialog"],[role="alertdialog"]{cursor:move}[role="dialog"] input,[role="dialog"] textarea,[role="dialog"] select,[role="alertdialog"] input,[role="alertdialog"] textarea,[role="alertdialog"] select{cursor:auto}[role="dialog"] button,[role="alertdialog"] button,[role="dialog"] label,[role="alertdialog"] label{cursor:pointer}';
    document.head.appendChild(st);
    const SEL = '[role="dialog"],[role="alertdialog"]';
    const keyOf = el => el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || 'popup';
    const find = k => [].slice.call(document.querySelectorAll(SEL)).filter(el => keyOf(el) === k)[0];
    const put = (el, o) => { const v = o ? o[0] + 'px ' + o[1] + 'px' : ''; if (el.style.translate !== v) el.style.translate = v; };
    const sync = () => {
      const seen = {};
      [].slice.call(document.querySelectorAll(SEL)).forEach(el => { const k = keyOf(el); seen[k] = 1; put(el, off[k]); });
      Object.keys(off).forEach(k => { if (!seen[k] && !(drag && drag.k === k)) delete off[k]; });
    };
    new MutationObserver(sync).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
    document.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      const el = e.target.closest && e.target.closest(SEL); if (!el) return;
      if (e.target.closest('input,textarea,select,button,a,label,option,[contenteditable="true"],[role="checkbox"],[role="radio"],[role="switch"],[role="tab"],[role="menuitem"],[draggable="true"]')) return;
      const k = keyOf(el), o = off[k] || [0, 0];
      drag = { k: k, x: e.clientX, y: e.clientY, ox: o[0], oy: o[1] };
      e.preventDefault();
    }, true);
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      const el = find(drag.k); if (!el) return;
      let nx = drag.ox + e.clientX - drag.x, ny = drag.oy + e.clientY - drag.y;
      off[drag.k] = [nx, ny]; put(el, off[drag.k]);
      // 화면 밖으로 다 나가지 않게: 위쪽은 화면 안, 좌우·아래는 80px 이상 보이게
      const r = el.getBoundingClientRect();
      if (r.top < 0) ny -= r.top;
      if (r.top > window.innerHeight - 60) ny -= r.top - (window.innerHeight - 60);
      if (r.left > window.innerWidth - 80) nx -= r.left - (window.innerWidth - 80);
      if (r.right < 80) nx += 80 - r.right;
      off[drag.k] = [nx, ny]; put(el, off[drag.k]);
    });
    document.addEventListener('mouseup', () => { drag = null; });
  }
  componentDidMount() {
    this.installPopupDrag();
    this._st = e => { if (e.key === 'academy.menu') this.setState({ tick: Date.now() }); };
    window.addEventListener('storage', this._st);
    this._dbl = () => this.setState({ tick: Date.now() });
    document.addEventListener('academy:data', this._dbl);
    this._hc = () => this.setState({ view: this.viewOfHash() });
    window.addEventListener('hashchange', this._hc);
  }
  // 맨 위 메뉴 탭 (모든 페이지 공통): 설정 > 메뉴 탭에서 순서·이름·숨기기·추가·삭제를 정한다.
  // 이 브라우저에 'academy.menu'로 저장하고, 로그인한 사이트에서는 Supabase(app_settings)와 같이 쓴다.
  menuItems() {
    const DEF = [['attendance', '출석부', 'attendance.html'], ['students', '수강생대장', 'students.html'], ['money', '수입·지출', '#'], ['stats', '통계', '#'], ['settings', '설정', 'settings.html']];
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem('academy.menu') || 'null'); } catch (e) {}
    const base = {};
    DEF.forEach(d => { base[d[0]] = { id: d[0], label: d[1], href: d[2], builtin: true, custom: false, hidden: false }; });
    const out = [];
    (Array.isArray(cfg) ? cfg : []).forEach(c => {
      if (!c || !c.id) return;
      if (base[c.id]) { out.push(Object.assign({}, base[c.id], { label: c.label || base[c.id].label, hidden: c.id === 'settings' ? false : !!c.hidden })); delete base[c.id]; }
      else if (c.custom) out.push({ id: c.id, label: c.label || '새 탭', href: '#', builtin: false, custom: true, hidden: !!c.hidden });
    });
    DEF.forEach(d => { if (base[d[0]]) out.push(base[d[0]]); });
    return out;
  }
  menuTabs(cur, cnts) {
    // 강사 계정은 수강생대장을 볼 수 없다
    return this.menuItems().filter(t => !t.hidden && !(t.id === 'students' && this.isTeacherUser())).map(t => ({
      label: t.label, cnt: (cnts || {})[t.id] || '', href: t.href,
      style: 'display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px 8px 0 0; font-size: 14px; white-space: nowrap; text-decoration: none; position: relative; top: 1px; ' +
        (t.id === cur ? 'background: #F3F5F4; color: #17201C; font-weight: 600; border: 1px solid #C6CDC7; border-bottom: 1px solid #F3F5F4' : 'color: #66716A; font-weight: 500; border: 1px solid transparent')
    }));
  }
  // 수강과목 (설정 > 수강과목, 모든 페이지 공통). 이 브라우저 'academy.subjects', 로그인 사이트는 Supabase subjects와 같이 씀
  subjectList() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem('academy.subjects') || 'null'); } catch (e) {}
    if (Array.isArray(v) && v.length) return v;
    return [['드럼', '#D7EFDD', '#2F6B43'], ['보컬', '#FCF1C2', '#7A6200'], ['기타', '#F9D9D6', '#9A3A31'], ['베이스', '#D6E6F7', '#2E5A8A'], ['피아노', '#E6DFF5', '#5B4A8B'], ['우쿨렐레', '#EADDD0', '#6B4A2E']]
      .map((s, i) => ({ id: 'S' + (i + 1), name: s[0], bg: s[1], fg: s[2], sort: i + 1, preset: true }));
  }
  // 과목 이름 → [바탕색, 글자색] ('원장'은 금색)
  partColors() {
    const o = { '원장': ['#F3E6C4', '#7A5C12'] };
    this.subjectList().forEach(s => { o[s.name] = [s.bg || '#EEF1F0', s.fg || '#3A4450']; });
    return o;
  }
  // 직원명부 (설정 > 직원명부). 이 브라우저 'academy.employees', 로그인 사이트는 Supabase employees와 같이 씀. 연번 순서 그대로
  employeeList() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem('academy.employees') || 'null'); } catch (e) {}
    const A = window.academy;
    if (Array.isArray(v) && v.length) return v.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
    if (A && A.sb) return [];
    // 시안(로그인 없는 화면)용 가짜 샘플
    return [['원장', '김도윤', ['기타', '우쿨렐레']], ['강사', '이하늘', ['보컬']], ['강사', '박서준', ['드럼']], ['강사', '최민재', ['베이스']], ['강사', '정우진', ['피아노']]]
      .map((e, i) => ({ id: 'X' + (i + 1), seq: i + 1, role: e[0], name: e[1], subjects: e[2], tab: true, hire: '2016-04-04', leave: '', phone: '', addr: '', memo: '', email: '', sample: true }));
  }
  // 오늘 기준 해임된 직원인지
  isDismissed(e) { const t = new Date(), td = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); return !!(e && e.leave && e.leave <= td); }
  // 전체 페이지 공통 직원 순서 (설정 > 직원 > 직원 순서): 출석부 강사 탭·수강생대장 강사 목록·통계 등이 이 순서와 '사용' 여부를 따른다.
  // 'academy.staffOrder' = [{ id, use }] (로그인 사이트는 Supabase app_settings 'staffOrder'와 같이 씀). 목록에 없는 새 직원은 맨 뒤에 '사용'으로 붙는다.
  staffOrdered() {
    const E = this.employeeList();
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem('academy.staffOrder') || 'null'); } catch (e) {}
    const out = [], seen = {};
    (Array.isArray(cfg) ? cfg : []).forEach(c => { const e = E.find(x => x.id === c.id); if (e && !seen[e.id]) { seen[e.id] = 1; out.push(Object.assign({}, e, { use: c.use !== false })); } });
    E.forEach(e => { if (!seen[e.id]) out.push(Object.assign({}, e, { use: true })); });
    return out;
  }  // 강사 이름 색 (직원명부 등록·수정에서 고름). 고르지 않으면 자동 = 원장은 금색, 강사는 첫 번째 교습과목 색. 직원명부에 없는 이름은 회색
  teacherColor(name) {
    const P = this.partColors();
    const e = this.employeeList().find(x => x.name === name);
    if (!e) return ['#EEF1F0', '#3A4450'];
    const c = String(e.color || '').split('|');
    if (/^#[0-9A-Fa-f]{6}$/.test(c[0]) && /^#[0-9A-Fa-f]{6}$/.test(c[1] || '')) return c;
    const own = (Array.isArray(e.titles) && e.titles.length ? e.titles : [e.role]).indexOf('원장') >= 0;
    return (own ? P['원장'] : P[(e.subjects || [])[0]]) || ['#EEF1F0', '#3A4450'];
  }

  // 로그인한 사람이 강사면 true (원장·로그인 없는 시안이면 false)
  isTeacherUser() { const A = window.academy; return !!(A && A.staff && A.staff.role !== 'owner'); }
  // 설정 안의 기능 목록 (카드 = 묶음, 줄 = 기능). 새 기능은 여기에 넣는다. ready: false 이면 '준비 중'
  features() {
    return [
      { title: '화면·메뉴', items: [{ id: 'menu', label: '메뉴 탭', ready: true }] },
      { title: '수업', items: [{ id: 'subjects', label: '수강과목', ready: true }] },
      // 직원명부는 원장님만 (강사 계정에는 보이지 않음)
      { title: '직원', items: this.isTeacherUser() ? [] : [{ id: 'staff', label: '직원명부', ready: true }] }
    ].filter(g => g.items.length);
  }
  viewOfHash() {
    const h = (location.hash || '').replace('#', '');
    return this.features().some(g => g.items.some(i => i.id === h)) ? h : 'hub';
  }
  openView(id) {
    try { if (id === 'hub') history.replaceState(null, '', location.pathname + location.search); else location.hash = id; } catch (e) {}
    this.setState({ view: id, err: '', resetAsk: false });
  }
  // ---------- 수강과목 ----------
  palette() {
    return [['#D7EFDD', '#2F6B43'], ['#FCF1C2', '#7A6200'], ['#F9D9D6', '#9A3A31'], ['#D6E6F7', '#2E5A8A'], ['#E6DFF5', '#5B4A8B'], ['#EADDD0', '#6B4A2E'], ['#D5F0EF', '#1F6F6B'], ['#FCE1EC', '#94305C'], ['#FDE7D2', '#9A4A12'], ['#E5E9EC', '#3A4450']];
  }
  saveSubjects(list) {
    try { localStorage.setItem('academy.subjects', JSON.stringify(list.map((s, i) => ({ id: s.id, name: s.name, bg: s.bg, fg: s.fg, sort: i + 1 })))); } catch (e) {}
    this.setState({ tick: Date.now(), err: '' });
  }
  addSubject() {
    const el = document.getElementById('newSubj');
    const name = ((el && el.value) || '').trim();
    if (!name) { this.setState({ err: '수강과목 이름을 입력해 주세요.' }); return; }
    const list = this.subjectList();
    if (list.some(s => s.name === name)) { this.setState({ err: '같은 이름의 수강과목이 있습니다.' }); return; }
    const P = this.palette(), used = list.map(s => s.bg), c = P.find(p => used.indexOf(p[0]) < 0) || P[list.length % P.length];
    const id = 'j' + Date.now();
    list.push({ id: id, name: name, bg: c[0], fg: c[1] });
    if (el) el.value = '';
    this._flash = id; clearTimeout(this._ft); this._ft = setTimeout(() => { this._flash = null; this.setState({}); }, 900);
    this.saveSubjects(list);
  }
  // 이름을 바꾸면 직원명부의 수강과목도 같이 바꾼다
  renameSubject(id, nm) {
    const list = this.subjectList(), s = list.find(x => x.id === id);
    if (!s || !nm || nm === s.name) return false;
    if (list.some(x => x.name === nm)) { this.setState({ err: '같은 이름의 수강과목이 있습니다.' }); return false; }
    const old = s.name; s.name = nm;
    const E = this.employeeList();
    if (E.some(e => (e.subjects || []).indexOf(old) >= 0)) this.saveEmployees(E.map(e => Object.assign({}, e, { subjects: (e.subjects || []).map(x => x === old ? nm : x) })));
    this.saveSubjects(list);
    return true;
  }
  // ---------- 직원명부 ----------
  saveEmployees(list) {
    try { localStorage.setItem('academy.employees', JSON.stringify(list.map(e => { const o = Object.assign({}, e); delete o.sample; return o; }))); } catch (e) {}
    this.setState({ tick: Date.now() });
  }
  todayYmd() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
  openEmp(e) {
    const E = this.employeeList();
    const seq = e ? e.seq : (E.reduce((m, x) => Math.max(m, x.seq || 0), 0) + 1);
    const d = e ? Object.assign(JSON.parse(JSON.stringify(e)), { titles: this.titlesOf(e) }) : { id: 'e' + Date.now(), seq: seq, role: '강사', titles: ['강사'], name: '', phone: '', addr: '', duty: '', email: '', subjects: [], tab: true, admin: false, color: '', hire: this.todayYmd(), leave: '', leaveReason: '', memo: '' };
    this.setState({ ed: Object.assign(d, { isEdit: !!e, err: '', origEmail: e ? (e.email || '') : '' }) });
  }
  saveEmp() {
    const D = this.state.ed;
    if (!D) return;
    const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const rec = Object.assign({}, D, { duty: v('e_duty').trim(), name: v('e_name').trim(), phone: v('e_phone').replace(/[^0-9]/g, ''), addr: v('e_addr').trim(), memo: v('e_memo'), email: v('e_email').trim(), hire: v('e_hire') || D.hire });
    if (!rec.name) { this.setState({ ed: Object.assign({}, D, rec, { err: '성명을 입력해 주세요.' }) }); return; }
    if (!(rec.titles || []).length) { this.setState({ ed: Object.assign({}, D, rec, { err: '직명을 하나 이상 골라 주세요.' }) }); return; }
    rec.role = rec.titles.indexOf('원장') >= 0 ? '원장' : '강사';
    const A = window.academy;
    if (A && A.staff && rec.leave && rec.email && rec.email === (A.staff.email || '')) {}
    const keep = ['id', 'seq', 'role', 'titles', 'name', 'phone', 'addr', 'duty', 'email', 'subjects', 'tab', 'admin', 'color', 'hire', 'leave', 'leaveReason', 'memo', 'linked'];
    const clean = {}; keep.forEach(k => { if (rec[k] !== undefined) clean[k] = rec[k]; });
    const list = this.employeeList();
    const i = list.findIndex(e => e.id === D.id);
    if (i >= 0) list[i] = clean; else list.push(clean);
    this._flash = D.id; clearTimeout(this._ft); this._ft = setTimeout(() => { this._flash = null; this.setState({}); }, 1600);
    this.saveEmployees(list);
    this.setState({ ed: null, toast: '' });
    // 로그인 계정 연결 (이메일이 바뀌었을 때, 로그인한 사이트에서)
    if (A && A.linkAccount && clean.email && clean.email !== D.origEmail) {
      const tryLink = (id, n) => {
        if (!/^E\d+$/.test(id)) { if (n < 20) setTimeout(() => { const cur = this.employeeList().find(x => x.seq === clean.seq); tryLink(cur ? cur.id : id, n + 1); }, 300); return; }
        A.linkAccount(id, clean.email).then(r => {
          if (r === 'ok') { this.saveEmployees(this.employeeList().map(x => x.id === id ? Object.assign({}, x, { linked: true }) : x)); A.toast && A.toast.call(null, ''); }
          else if (r === 'no_user') A.toast('이 이메일로 만든 로그인 계정이 없습니다. Supabase에서 먼저 계정을 만들어 주세요.');
        });
      };
      tryLink(clean.id, 0);
    }
  }
  titlesOf(e) { const t = Array.isArray(e.titles) && e.titles.length ? e.titles.slice() : [e.role || '강사']; return ['원장', '강사', '행정'].filter(x => t.indexOf(x) >= 0); }
  // 직원 순서 바꾸기: 보이는 순서대로 순번(seq)을 다시 매겨 저장 (원장님만, 출석부 강사 탭 순서도 같이)
  reorderEmp(ids) {
    if (!this.canEdit()) return;
    const E = this.employeeList();
    const pos = {}; ids.forEach((id, i) => { pos[id] = i; });
    this.saveEmployees(E.slice().sort((a, b) => (pos[a.id] == null ? 999 : pos[a.id]) - (pos[b.id] == null ? 999 : pos[b.id])).map((e, i) => Object.assign({}, e, { seq: i + 1 })));
  }
  staffHidden() { return this.readArr('staff.hidden') || []; }
  // ---------- 직원명부 표시할 항목·필터 (수강생대장과 같은 방식, 이 브라우저에 저장) ----------
  staffCols() {
    return [
      { k: 'seq', label: '연번', w: 60 }, { k: 'role', label: '직명', w: 110 }, { k: 'name', label: '성명', w: 96, fixed: true, left: true },
