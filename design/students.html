<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수강생대장</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>.shell{height:100vh!important;min-height:0!important}.shellmain{flex:1 1 auto!important;min-height:0!important;overflow:hidden!important;padding-bottom:14px!important}.shell>header,.shell>nav,.shell>div:not(.shellmain){flex:none!important}.shellmain>*:not(.shellsec){flex:none}.shellsec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.shellscroll{flex:1 1 auto;min-height:0;overflow:auto!important}
@media print{.shell{height:auto!important}.shellmain{overflow:visible!important}.shellsec{display:block!important}.shellscroll{overflow:visible!important}}

body{margin:0;background:#F3F5F4}
a{color:#007E82}a:hover{color:#005F62}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #00A6AB;outline-offset:1px}
.idInp:hover{border-color:#CDD4D0 !important;background:#FFFFFF !important}.idInp:focus{border-color:#00A6AB !important;background:#FFFFFF !important}
.colgrip:hover,.colgrip:active{background:linear-gradient(to right,transparent 3px,#00A6AB 3px,#00A6AB 5px,transparent 5px)}
@page{size:A4 landscape;margin:8mm}
.printonly{display:none}
html.bwp .printonly *{color:#000!important;background-color:transparent!important}
html.bwp .printonly .pcell,html.bwp .printonly .phead{border-color:#000!important}
@media print{.noprint{display:none!important}.printonly{display:block!important}html,body{background:#FFFFFF!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.flashrow>span{animation:rowflash 3.6s ease-out}
.flash-rest>span{--fl:rgba(224,162,59,.22)}.flash-out>span{--fl:rgba(217,116,108,.2)}.flash-back>span,.flash-new>span{--fl:rgba(0,166,171,.18)}.flash-edit>span{--fl:rgba(138,180,232,.25)}
@keyframes rowflash{0%,55%{background-image:linear-gradient(var(--fl),var(--fl))}100%{background-image:linear-gradient(transparent,transparent)}}
.flashtag{animation:tagfade 4s ease-out forwards}
@keyframes tagfade{0%,75%{opacity:1}100%{opacity:0}}
.regdlg [disabled]{opacity:.42;cursor:not-allowed!important}
.srow:hover>span{background-color:#F7FAFA}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="noprint shell" style="display: flex; flex-direction: column; min-height: 100vh; font-family: 'Paperlogy', 'Paperlogy 4 Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17201C; background: #F3F5F4; font-variant-numeric: tabular-nums">

  <header style="background: #FFFFFF; border-bottom: 1px solid #C6CDC7; padding: 8px 24px 0; display: flex; flex-direction: column">
    <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <a href="{{t.href}}" style="{{t.style}}">{{t.label}}<span style="font-size: 11px; color: #66716A; margin-left: 4px">{{t.cnt}}</span></a>
      </sc-for>
    </nav>
  </header>

  <main class="shellmain" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 28px 40px; box-sizing: border-box">

    <section aria-label="수강생대장" class="shellsec" style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 16px; box-shadow: 0 1px 3px rgba(23, 32, 28, 0.05)">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #EBEEEC">
        <span style="display: inline-flex; align-items: center; gap: 14px">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #00A6AB; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 166, 171, 0.32)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>
          <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; padding: 0 2px; background-image: linear-gradient(transparent 62%, #BFEAEB 62%, #BFEAEB 92%, transparent 92%)">현실용음악학원 수강생대장</span>
        </span>
        <span style="flex: 1"></span>
        <div role="tablist" aria-label="원생 구분" style="display: flex; gap: 8px">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
          </sc-for>
        </div>
      </div>

      <div id="{{cur.id}}" style="{{cur.bandStyle}}">
        <span style="{{cur.dotStyle}}"></span>
        <span style="font-size: 15px; font-weight: 800">{{cur.title}}</span>
        <span style="{{cur.countStyle}}">{{cur.count}}명</span>
        <span style="font-size: 12px; color: #8A949E">{{cur.note}}</span>
        <span style="flex: 1"></span>
        <div style="position: relative">
          <button type="button" onClick="{{flt.toggle}}" aria-expanded="{{flt.openTxt}}" aria-haspopup="dialog" style="{{flt.btnStyle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg>필터<sc-if value="{{flt.hasActive}}" hint-placeholder-val="{{ false }}"><span style="{{flt.badge}}">{{flt.count}}</span></sc-if></button>
          <sc-if value="{{flt.open}}" hint-placeholder-val="{{ false }}">
            <div onMouseDown="{{flt.close}}" style="position: fixed; inset: 0; z-index: 30"></div>
            <div role="dialog" aria-label="필터" style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 31; width: 600px; max-width: calc(100vw - 48px); box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 18px; box-shadow: 0 18px 48px rgba(23, 32, 28, 0.18)">
              <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid #EEF1F0">
                <span style="font-size: 16px; font-weight: 800">필터</span>
                <span style="font-size: 12px; color: #8A949E">{{flt.summary}}</span>
                <span style="flex: 1"></span>
                <button type="button" onClick="{{flt.reset}}" style="height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #3A4450; font-size: 13px; font-weight: 600; cursor: pointer">초기화</button>
                <button type="button" onClick="{{flt.close}}" aria-label="필터 닫기" style="width: 32px; height: 32px; border-radius: 9px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; font-size: 16px; line-height: 1; cursor: pointer">×</button>
              </div>
              <sc-for list="{{flt.groups}}" as="g" hint-placeholder-count="8">
                <div role="group" aria-label="{{g.label}}" style="display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px">
                  <span style="font-size: 13px; font-weight: 700; color: #5E6873">{{g.label}}</span>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px">
                    <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4">
                      <button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
              <sc-if value="{{flt.none}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0 8px; font-size: 14px; color: #5E6873">
                  <span>아직 고른 필터 항목이 없습니다.</span>
                  <button type="button" onClick="{{flt.openCfg}}" style="height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid #A9DCDE; background: #F2FBFB; color: #007E82; font-size: 14px; font-weight: 700; cursor: pointer">필터 항목 고르기</button>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>
        <label for="q" style="position: absolute; left: -9999px">이름, 보호자, 전화번호, 등록번호로 찾기</label>
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #DDE2DF; background: #FFFFFF; width: 260px; box-sizing: border-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A949E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
          <input id="q" type="text" defaultValue="{{q}}" placeholder="이름, 보호자, 전화번호, 등록번호" onInput="{{onSearch}}" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 13px; color: #17201C">
        </span>
        <sc-if value="{{cur.canReg}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{regOpen}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: none; background: #00A6AB; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>원생 등록</button>
        </sc-if>
        <button type="button" onClick="{{colsCfg.open}}" aria-label="표시할 항목 설정" title="표시할 항목 설정" style="width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #5E6873; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
      </div>

      <div id="tableScroll" class="shellscroll" style="overflow-x: auto; border-radius: 0 0 16px 16px">
        <div style="{{tableMin}}">
          <div style="{{gridHead}}">
            <sc-for list="{{headCols}}" as="h" hint-placeholder-count="12">
              <span style="{{h.style}}">{{h.label}}<span class="colgrip" onMouseDown="{{h.resize}}" onDblClick="{{h.resetW}}" title="끌어서 폭 조절 · 두 번 누르면 원래 폭" style="position: absolute; top: 0; bottom: 0; right: -4px; width: 8px; cursor: col-resize; z-index: 2"></span></span>
            </sc-for>
            <span></span>
            <sc-for list="{{xHeads}}" as="h" hint-placeholder-count="0">
              <span style="{{h.style}}">{{h.label}}<span class="colgrip" onMouseDown="{{h.resize}}" onDblClick="{{h.resetW}}" title="끌어서 폭 조절 · 두 번 누르면 원래 폭" style="position: absolute; top: 0; bottom: 0; left: -4px; width: 8px; cursor: col-resize; z-index: 2"></span></span>
            </sc-for>
            <span style="{{actHead}}">관리</span>
          </div>
          <sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="6">
            <div class="{{r.rowCls}}" style="{{gridRow}}">
              <sc-for list="{{r.cells}}" as="x" hint-placeholder-count="12">
                <span style="{{x.cell}}"><sc-if value="{{x.isName}}" hint-placeholder-val="{{ false }}"><span style="{{x.nameStyle}}">{{x.text}}</span><sc-if value="{{x.cash}}" hint-placeholder-val="{{ false }}"><span title="현금영수증 발행" style="display: inline-flex; color: #00A6AB"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="현금영수증"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg></span></sc-if><span style="font-size: 12px; color: #8A949E">{{x.sub}}</span><sc-if value="{{x.flashTag}}" hint-placeholder-val="{{ false }}"><span class="flashtag" style="{{x.flashStyle}}">{{x.flashTag}}</span></sc-if></sc-if><sc-if value="{{x.isChip}}" hint-placeholder-val="{{ false }}"><span style="{{x.chip}}">{{x.text}}</span></sc-if><sc-if value="{{x.isText}}" hint-placeholder-val="{{ true }}">{{x.text}}</sc-if></span>
              </sc-for>
              <span style="{{r.fill}}"></span>
              <sc-for list="{{r.xcells}}" as="x" hint-placeholder-count="0">
                <span style="{{x.cell}}">{{x.text}}</span>
              </sc-for>
              <span style="{{r.actCell}}">
                <sc-for list="{{r.acts}}" as="a" hint-placeholder-count="3">
                  <button type="button" onClick="{{a.pick}}" aria-label="{{a.aria}}" style="{{a.style}}">{{a.label}}</button>
                </sc-for>
              </span>
            </div>
          </sc-for>
          <sc-if value="{{cur.empty}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 22px; text-align: center; font-size: 13px; color: #8A949E; border-bottom: 1px solid #EBEEEC">찾는 원생이 없습니다.</div>
          </sc-if>
        </div>
      </div>
    </section>

    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button type="button" onClick="{{printX}}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #17201C; font-size: 13px; font-weight: 600; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"></path></svg>
        인쇄
      </button>
      <button type="button" onClick="{{exportX}}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #D9DEE3; background: #FFFFFF; color: #17201C; font-size: 13px; font-weight: 600; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
        엑셀로 내보내기
      </button>
    </div>
  </main>

  <div style="display: flex; justify-content: flex-end; padding: 8px 16px; border-top: 1px solid #DDE2DF; background: #FFFFFF; font-size: 11px; color: #8A949E">v0.32.0</div>
  <sc-if value="{{colsCfg.isOpen}}" hint-placeholder-val="{{ false }}">
    <div onMouseDown="{{colsCfg.close}}" style="position: fixed; inset: 0; z-index: 40; background: rgba(23, 32, 28, 0.32)"></div>
    <div role="dialog" aria-label="설정" onKeyDown="{{colsCfg.key}}" tabIndex="-1" id="cfgDlg" style="outline: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 41; width: 940px; max-width: calc(100vw - 48px); max-height: calc(100vh - 48px); box-sizing: border-box; display: flex; flex-direction: column; background: #F6F8F7; border: 1px solid #DDE2DF; border-radius: 26px; box-shadow: 0 30px 80px rgba(23, 32, 28, 0.28); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 14px; padding: 18px 26px; background: #FFFFFF; border-bottom: 1px solid #E8ECEA">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #EEF1F0; color: #3A4450; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span>
        <div role="tablist" aria-label="설정 종류" style="display: inline-flex; padding: 4px; border-radius: 14px; background: #EEF1F0; gap: 4px">
          <sc-for list="{{colsCfg.tabs}}" as="t" hint-placeholder-count="2">
            <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <span style="flex: 1"></span>
        <button type="button" onClick="{{colsCfg.reset}}" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #DDE2DF; background: #FFFFFF; color: #3A4450; font-size: 13px; font-weight: 600; cursor: pointer">기본값으로</button>
        <button type="button" onClick="{{colsCfg.close}}" aria-label="닫기" style="width: 38px; height: 38px; border-radius: 10px; border: 1px solid #E1E6E3; background: #FFFFFF; color: #5E6873; cursor: pointer; font-size: 18px; line-height: 1">×</button>
      </div>
      <div id="colsBody" style="flex: 1; overflow: auto; padding: 22px 26px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{colsCfg.cats}}" as="cat" hint-placeholder-count="5">
            <div role="group" aria-label="{{cat.label}}" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8E5">
              <span style="font-size: 14px; font-weight: 800; color: #17201C">{{cat.label}}</span>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <sc-for list="{{cat.items}}" as="it" hint-placeholder-count="4">
                  <button type="button" role="checkbox" aria-checked="{{it.on}}" onClick="{{it.toggle}}" style="{{it.style}}"><span style="{{it.box}}">✓</span>{{it.label}}</button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8E5">
          <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 14px; font-weight: 800">{{colsCfg.orderTitle}}</span><span style="font-size: 12px; color: #8A949E">{{colsCfg.count}}개 · 끌어서 옮기기</span></span>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{colsCfg.order}}" as="o" hint-placeholder-count="12">
              <li draggable="true" onDragStart="{{o.dragStart}}" onDragOver="{{o.dragOver}}" onDrop="{{o.drop}}" style="{{o.style}}">
                <span aria-hidden="true" style="color: #B9C2BD; font-size: 14px; letter-spacing: -2px; cursor: grab">⋮⋮</span>
                <span style="width: 22px; font-size: 12px; font-weight: 700; color: #8A949E; text-align: right">{{o.n}}</span>
                <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #17201C">{{o.label}}</span>
                <button type="button" onClick="{{o.up}}" disabled="{{o.first}}" aria-label="{{o.upLabel}}" style="{{o.arrow}}">▲</button>
                <button type="button" onClick="{{o.down}}" disabled="{{o.last}}" aria-label="{{o.downLabel}}" style="{{o.arrow}}">▼</button>
              </li>
            </sc-for>
          </ol>
          <sc-if value="{{colsCfg.emptyOrder}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 20px 0; text-align: center; font-size: 13px; color: #8A949E">왼쪽에서 항목을 체크하세요.</div>
          </sc-if>
        </div>
      </div>
    </div>

<script>
class DCLogic{constructor(props){this.props=props||{};this.state={}}
  setState(p){this.state=Object.assign({},this.state,p);render()}}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let cols = null;
    try { const v = JSON.parse(localStorage.getItem('students.cols') || 'null'); if (Array.isArray(v)) cols = v; } catch (e) {}
    let widths = {};
    try { const w = JSON.parse(localStorage.getItem('students.widths') || 'null'); if (w && typeof w === 'object') widths = w; } catch (e) {}
    let fltList = [];
    try { const v = JSON.parse(localStorage.getItem('students.filters') || 'null'); if (Array.isArray(v)) fltList = v; } catch (e) {}
    this.state = { statusShared: this.readStatus(), shared: this.readShared(), log: {}, histView: null, hist: {}, changes: {}, stat: null, fltList: fltList, cfgTab: 'cols', widths: widths, q: '', tab: 'act', reg: null, added: [], toast: '', filt: {}, fltOpen: false, colsOpen: false, cols: cols };
  }
  // 원생 항목 목록 (한 곳에서만 정의). 새 항목을 여기에 넣으면 설정의 '표시할 항목'과 '필터 항목'에 자동으로 들어간다.
  //   g: 설정 창 묶음 (null이면 설정에 안 나옴), w: 열 폭, left: 왼쪽 정렬
  //   f: 필터 — 'auto'(실제 값으로 선택지 자동 생성), 필터 이름 목록, 또는 없음(원생마다 값이 다 다른 항목)
  colCatalog() {
    return [
      { k: 'id', label: '등록번호', w: '76px', g: '기본 정보' },
      { k: 'cls', label: '반 구분', w: '84px', g: '기본 정보', f: ['cls'] },
      { k: 'name', label: '이름 / 보호자', w: '150px', left: true, g: '기본 정보' },
      { k: 'age', label: '연령', w: '70px', g: '기본 정보', f: ['age'] },
      { k: 'gender', label: '성별', w: '60px', g: '기본 정보', f: ['gender'] },
      { k: 'phone', label: '원생 전화번호', w: '128px', g: '기본 정보' },
      { k: 'gphone', label: '보호자 전화번호', w: '128px', g: '기본 정보' },
      { k: 'birth', label: '생년월일', w: '104px', g: '기본 정보', f: ['birthY'] },
      { k: 'addr', label: '주소', w: '200px', left: true, g: '기본 정보' },
      { k: 'join', label: '입원 연월일', w: '96px', g: '기본 정보', f: ['joinY'] },
      { k: 'backDate', label: '복귀 날짜', w: '96px', g: '기본 정보', f: ['backY'] },
      { k: 'part', label: '파트', w: '92px', g: '수업 정보', f: ['part'] },
      { k: 'teacher', label: '강사', w: '92px', g: '수업 정보', f: ['teacher'] },
      { k: 'day', label: '레슨요일', w: '92px', g: '수업 정보', f: ['day'] },
      { k: 'time', label: '수업 시간', w: '120px', g: '수업 정보', f: ['time'] },
      { k: 'stick', label: '드럼스틱 보관함', w: '110px', g: '수업 정보', f: ['stick'] },
      { k: 'count', label: '수강 횟수', w: '80px', g: '수강료', f: ['count'] },
      { k: 'dur', label: '수강 시간', w: '80px', g: '수강료', f: ['dur'] },
      { k: 'unit', label: '회당 수업료', w: '104px', g: '수강료', f: ['unit'] },
      { k: 'total', label: '수강료 합계', w: '110px', g: '수강료', f: ['total'] },
      { k: 'pay', label: '강사 수당', w: '96px', g: '수강료', f: ['pay'] },
      { k: 'cash', label: '현금영수증', w: '90px', g: '현금영수증', f: ['cash', 'cashType'] },
      { k: 'restDate', label: '휴원 날짜', w: '96px', g: null },
      { k: 'restReason', label: '휴원 사유', w: '150px', left: true, g: null },
      { k: 'restTicket', label: '휴원 당시 수강권', w: '130px', g: null },
      { k: 'leave', label: '퇴원 날짜', w: '96px', g: null },
      { k: 'leaveReason', label: '퇴원 사유', w: '200px', left: true, g: null },
      { k: 'memo', label: '비고', w: '140px', left: true, g: null },
      { k: 'rest', label: '휴원정보', w: '150px', left: true, g: null },
      { k: 'note', label: '원생 메모', w: '240px', left: true, g: '메모' }
    ];
  }
  visibleCols() {
    const DEF = ['id', 'part', 'name', 'teacher', 'day', 'age', 'phone', 'gphone', 'join'];
    // 휴원정보·퇴원 연월일·비고는 설정에 넣지 않고 휴원·퇴원 탭에서만 붙인다
    const keys = this.colCatalog().filter(c => c.g).map(c => c.k);
    const v = (this.state.cols || DEF).filter(k => keys.indexOf(k) >= 0);
    return v.indexOf('name') >= 0 ? v : ['name'].concat(v);
  }
  enrich(s) {
    const ex = s.extra || {};
    const fl = s.flags || {};
    const pro = !!fl.pro;
    const days = s.days || [s.day];
    const to12 = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? ((+m[1] % 12) || 12) + ':' + m[2] : ''; };
    const TL = ['2:00', '3:30', '4:00', '5:00', '6:30', '7:00'];
    const timeTxt = s.extra
      ? days.map(d => { const t = (ex.times || {})[d]; return t ? (days.length > 1 ? (d === '변동' ? 'R' : d[0]) + ' ' : '') + to12(t) : ''; }).filter(Boolean).join(' · ')
      : (days[0] === '변동' ? '' : days.length > 1 ? days.map((d, i) => d[0] + ' ' + TL[(s.id + i * 2) % 6]).join(' · ') : TL[s.id % 6]);
    const count = ex.count || (fl.t12 ? 12 : fl.t8 ? 8 : 4);
    const unit = ex.unit || (pro ? 62500 : 40000);
    const p2 = n => String(n).padStart(2, '0');
    const birth = s.extra ? (ex.birth || '').replace(/-/g, '.') : (s.age === '학생' ? 2010 + s.id % 7 : 1986 + s.id % 13) + '.' + p2(s.id % 12 + 1) + '.' + p2(s.id % 27 + 1);
    return Object.assign({}, s, {
      cls: pro ? 'pro' : 'hobby', days: days, timeTxt: timeTxt,
      gender: s.extra ? (ex.gender || '') : (s.id % 2 ? '남' : '여'),
      birth: birth, addr: s.extra ? (ex.addr || '') : '샘플구 음악로 ' + (s.id % 90 + 1),
      count: count, dur: ex.dur || 60, unit: unit, total: ex.total || unit * count, pay: ex.pay || Math.round(unit * 0.5),
      ...(() => {
        // 휴원: 날짜·사유·그 당시 수강권 / 지금 수강권(샘플: 출석부와 아직 연결 전)
        const tk = (used, cnt) => used + '/' + cnt + '회 (남은 ' + (cnt - used) + '회)';
        const usedNow = 1 + s.id % count;
        const rm = /^(\d{1,2})\.(\d{1,2})(?:\s*\((?:수업\s*)?(\d+)\/(\d+)\))?/.exec(s.rest || '');
        return {
          ticketNow: tk(Math.min(usedNow, count), count),
          restDate: s.restDate || (rm ? '26.' + String(rm[1]).padStart(2, '0') + '.' + String(rm[2]).padStart(2, '0') : ''),
          restTicket: s.restTicket || (rm && rm[3] ? tk(+rm[3], +rm[4]) : s.status === 'rest' ? tk(Math.min(usedNow, count), count) : '')
        };
      })(),
      cashOn: !!fl.cash, stick: s.extra ? !!ex.stickBox : (s.part === '드럼' && (s.id % 3 === 0 || (s.memo || '').indexOf('스틱') >= 0))
    });
  }
  students() {
    // changes: 수정·휴원·퇴원으로 바로 바뀐 내용 / hist: 적용 날짜가 있는 변경 (오늘까지 시작된 것만 반영)
    const ch = this.state.changes || {}, today = this.todayYmd();
    return this.baseStudents().concat(this.state.added || []).map(s => {
      let x = ch[s.id] ? this.mergeRec(s, ch[s.id]) : s;
      this.allHist(s.id, x.name).filter(h => h.from <= today).sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0).forEach(h => { x = this.mergeRec(x, h.patch); });
      // 휴원·퇴원·복귀 (출석부와 같이 쓰는 기록): 가장 나중에 처리한 것
      const st = (this.state.statusShared || []).filter(e => e.name === x.name).sort((a, b) => (a.at || 0) - (b.at || 0)).pop();
      if (st) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(st.date || ''); const ymd = m ? m[1].slice(2) + '.' + m[2] + '.' + m[3] : '';
        x = Object.assign({}, x, st.kind === 'rest' ? { status: 'rest', rest: '', restDate: ymd, restReason: st.reason || '', restTicket: st.ticket || '' }
          : st.kind === 'out' ? { status: 'out', leave: ymd, leaveReason: st.reason || '' }
          : { status: 'act', backDate: ymd, rest: '', restDate: '', restReason: '', restTicket: '', leave: '', leaveReason: '' });
      }
      return x;
    });
  }
  // 수업 요일·시간·드럼스틱 변경은 출석부와 같이 쓰는 기록(이 컴퓨터 브라우저에 저장)에 둔다. 원생은 이름으로 맞춘다
  readStatus() {
    try { const v = JSON.parse(localStorage.getItem('academy.statusChanges') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  readShared() {
    try { const v = JSON.parse(localStorage.getItem('academy.lessonChanges') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  writeShared(list) {
    try { localStorage.setItem('academy.lessonChanges', JSON.stringify(list)); } catch (e) {}
    return list;
  }
  componentDidMount() {
    this._st = e => { if (e.key === 'academy.lessonChanges') this.setState({ shared: this.readShared() }); if (e.key === 'academy.statusChanges') this.setState({ statusShared: this.readStatus() }); };
    window.addEventListener('storage', this._st);
  }
  componentWillUnmount() { window.removeEventListener('storage', this._st); }
  sharedToPatch(e) {
    const L = { '월': '월요일', '화': '화요일', '수': '수요일', '목': '목요일', '금': '금요일', '토': '토요일', 'R': '변동' };
    const days = (e.days || []).map(d => L[d]).filter(Boolean);
    const times = {};
    Object.keys(e.times || {}).forEach(d => { const m = /^(\d{1,2}):(\d{2})$/.exec(e.times[d]); if (m && L[d]) times[L[d]] = ((+m[1] % 12) || 12) + ':' + m[2]; });
    const p = { day: days.length ? days.map(x => x === '변동' ? (days.length > 1 ? 'R' : '변동') : (days.length > 1 ? x[0] : x)).join('·') : '변동', days: days.length ? days : ['변동'], extra: { times: times, stickBox: !!e.stick } };
    if (e.teacher) p.teacher = e.teacher;
    if (e.part) p.part = e.part;
    return p;
  }
  patchToShared(p) {
    const S = { '월요일': '월', '화요일': '화', '수요일': '수', '목요일': '목', '금요일': '금', '토요일': '토', '변동': 'R' };

if(comp.componentDidMount)comp.componentDidMount();
</script>
