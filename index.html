<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현실용음악학원 출석부</title>
<style>
:root{--brand:#00A6AB;--ink:#17201C;--muted:#5E6873;--line:#E1E6E3;--bg:#F3F5F4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Paperlogy','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 20px}
h1{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-0.03em}
h1 span.t{background-image:linear-gradient(transparent 62%,#BFEAEB 62%,#BFEAEB 92%,transparent 92%)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,166,171,.32)}
p.sub{margin:0 0 32px;color:var(--muted);font-size:15px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.card{display:flex;flex-direction:column;gap:4px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--brand)}
a.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a.card b{font-size:16px}
a.card span{font-size:13px;color:var(--muted)}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"></path></svg></span><span class="t">현실용음악학원 출석부</span></h1>
  <p class="sub">디자인 시안 모음</p>
  <ul>
    <li><a class="card" href="design/attendance.html"><b>출석부 시안</b><span>날짜 칸을 누르면 수업 → 결석 → 보강 → 연기 → 입금 순서로 바뀝니다</span></a></li>
    <li><a class="card" href="design/records.html"><b>기록 패널 시안</b><span>누가 언제 무엇을 처리했는지 보여주는 기록</span></a></li>
    <li><a class="card" href="prototype/spreadsheet-demo.html"><b>첫 시연판</b><span>엑셀형 표와 엑셀 내보내기</span></a></li>
  </ul>
  <footer>시안에 나오는 이름과 전화번호는 모두 가짜 샘플입니다.</footer>
</main>
</body>
</html>
